<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacist — MissionLink</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">ML</div>
    <div class="brand-text"><strong>MissionLink</strong><span>Pharmacist · <span class="mission-line" data-active-mission></span></span></div>
  </div>
  <div class="header-actions">
    <span class="role-pill role-pharmacist"><span class="dot" aria-hidden="true"></span>Pharmacist</span>
    <nav aria-label="Roles"><a class="exit-link" href="index.html">Switch role</a></nav>
  </div>
</header>

<main class="wide" id="main" tabindex="-1">
  <h1 class="visually-hidden">Pharmacist</h1>
  <div class="grid-2" style="align-items:start;">

    <section class="card" aria-labelledby="rxHeading">
      <h2 id="rxHeading">Prescriptions waiting</h2>
      <div id="rxQueue"></div>
    </section>

    <section class="card" aria-labelledby="stockHeading">
      <h2 id="stockHeading">Stock on hand</h2>
      <p class="small muted">Tapping "Mark dispensed" on a prescription is the only data entry this ever needs — the bars below update from that alone.</p>
      <div id="stockList"></div>
    </section>

  </div>
</main>
<footer class="app-foot">MissionLink · Pharmacist</footer>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/inventory.js"></script>
<script>
db_seedIfEmpty();

function renderRxQueue(){
  const entries = db_getQueue("pharmacy");
  const el = qs("#rxQueue");
  const key = JSON.stringify(entries) + JSON.stringify(db_getInventory());
  renderIfChanged(el, key, () => {
    if(entries.length === 0){ el.innerHTML = `<p class="muted small">Nothing waiting.</p>`; return; }
    el.innerHTML = "";
    entries.forEach(e => {
      const p = db_getPatient(e.patientId);
      if(!p) return;
      const v = latestVisit(p);
      const items = (v.prescription||[]).map(sku => db_getInventory().find(i=>i.sku===sku)).filter(Boolean);
      const card = document.createElement("article");
      card.className = "card";
      card.style.marginBottom = "10px";
      card.setAttribute("aria-label", "Prescription for " + p.name);
      card.innerHTML = `
        <div class="queue-left" style="margin-bottom:8px;">
          <div class="avatar"><img src="${avatarDataUri(p.name)}" alt=""></div>
          <div><h3 class="queue-name" style="margin:0;">${esc(p.name)}</h3><div class="queue-meta">${esc(p.id)} · ${esc(missionForCode(p.country).country)}</div></div>
        </div>
        ${items.length ? `<ul class="small" style="margin:0; padding-left:20px;">${items.map(i => `<li>${esc(i.name)} <span class="muted">(${i.onHand} on hand)</span></li>`).join("")}</ul>` : '<p class="small muted">No items on this order.</p>'}
        <button type="button" class="btn btn-primary btn-block" style="margin-top:10px;" data-focus-id="${esc(p.id)}" ${items.length ? "" : "disabled"}>Mark dispensed<span class="visually-hidden"> for ${esc(p.name)}</span></button>
      `;
      card.querySelector("button").addEventListener("click", () => {
        const results = dispensePrescription(items.map(i=>i.sku), p.id);
        const failed = results.filter(r => !r.ok);
        if(failed.length){
          toast("Short on: " + failed.map(f=>f.name).join(", "));
        } else {
          toast("Dispensed to " + p.name);
        }
        db_removeFromQueue(p.id);
        renderRxQueue();
        renderStock();
        focusEl(qs("#rxHeading"));
      });
      el.appendChild(card);
    });
  });
}

function renderStock(){
  const el = qs("#stockList");
  renderIfChanged(el, JSON.stringify(db_getInventory()), () => {
    el.innerHTML = stockRowsHtml(db_getInventory());
  });
}

renderRxQueue();
renderStock();
setInterval(() => { renderRxQueue(); renderStock(); }, 4000);
</script>
</body>
</html>
