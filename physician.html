<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physician — MissionLink</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">ML</div>
    <div class="brand-text"><strong>MissionLink</strong><span>Physician</span></div>
  </div>
  <div class="header-actions">
    <span class="role-pill role-physician"><span class="dot" aria-hidden="true"></span>Physician</span>
    <nav aria-label="Roles"><a class="exit-link" href="index.html">Switch role</a></nav>
  </div>
</header>

<main class="wide" id="main" tabindex="-1">
  <h1 class="visually-hidden">Physician</h1>
  <div class="grid-2 grid-sidebar">

    <section class="card" aria-labelledby="queueHeading">
      <h2 id="queueHeading">Waiting room</h2>
      <div id="queueList"></div>
    </section>

    <section class="card" id="chartCard" style="display:none;" aria-labelledby="pName">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
        <div>
          <h2 id="pName">—</h2>
          <p class="muted" id="pMeta"></p>
        </div>
        <span class="badge badge-amber"><span class="visually-hidden">Category: </span><span id="pCategory">—</span></span>
      </div>

      <div class="card" style="background:var(--paper); margin-top:12px;">
        <h3>Current complaint</h3>
        <p id="pComplaint" class="small"></p>
        <p class="small muted" id="pVitals"></p>
      </div>

      <div id="historySection"></div>

      <form id="ordersForm" novalidate>
        <h3 style="margin-top:16px;">Assessment &amp; orders</h3>
        <div class="btn-row" style="margin-bottom:8px;">
          <button type="button" class="mic-btn" id="micBtn"><span class="mic-dot" aria-hidden="true"></span><span id="micLabel" data-mic-label>Dictate note</span></button>
        </div>
        <div class="transcript-box" id="transcript" aria-hidden="true">Tap the mic, or type below.</div>
        <div class="field" style="margin-top:8px;">
          <label for="diagText">Diagnosis / notes (your own clinical judgment — nothing here is AI-generated)</label>
          <textarea id="diagText"></textarea>
        </div>

        <div class="field">
          <label class="check" for="labOrder"><input type="checkbox" id="labOrder" aria-controls="labResultField"> Order a lab / rapid test</label>
          <div id="labResultField" style="margin-top:6px; display:none;">
            <label for="labResult">Lab result</label>
            <input type="text" id="labResult" placeholder="Result, once available">
          </div>
        </div>

        <fieldset>
          <legend>Prescription <span class="muted small" style="font-weight:400;">(select all that apply)</span></legend>
          <div id="rxOptions" class="btn-row"></div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block" id="btnComplete" style="margin-top:12px;">Complete visit</button>
      </form>
    </section>

    <section class="card" id="emptyState" aria-label="Patient chart">
      <p class="muted">Select a patient from the waiting room.</p>
    </section>
  </div>
</main>
<footer class="app-foot">MissionLink · Physician</footer>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/speech.js"></script>
<script src="js/inventory.js"></script>
<script>
db_seedIfEmpty();
let current = null;

function renderQueue(){
  const entries = db_getQueue("physician");
  const list = qs("#queueList");
  const key = JSON.stringify(entries) + "|" + (current ? current.id : "");
  renderIfChanged(list, key, () => {
    if(entries.length === 0){ list.innerHTML = `<p class="muted small">No one waiting.</p>`; return; }
    list.innerHTML = "";
    const ul = document.createElement("ul");
    ul.className = "queue-list";
    entries.forEach(e => {
      const p = db_getPatient(e.patientId);
      if(!p) return;
      const v = latestVisit(p);
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "queue-item" + (e.urgent ? " urgent" : "");
      btn.dataset.focusId = p.id;
      if(current && current.id === p.id) btn.setAttribute("aria-current", "true");
      btn.innerHTML = `
        <span class="queue-left">
          <span class="avatar"><img src="${avatarDataUri(p.name)}" alt=""></span>
          <span>
            <span class="queue-name" style="display:block;">${esc(p.name)}</span>
            <span class="queue-meta" style="display:block;">${esc(categoryLabel(v.category))} · arrived ${esc(e.arrived)}</span>
          </span>
        </span>
        ${e.urgent ? '<span class="badge badge-danger">Urgent</span>' : ''}
      `;
      btn.addEventListener("click", () => openChart(p));
      li.appendChild(btn);
      ul.appendChild(li);
    });
    list.appendChild(ul);
  });
}

function openChart(p){
  current = p;
  qs("#emptyState").style.display = "none";
  qs("#chartCard").style.display = "block";
  const v = latestVisit(p);

  qs("#pName").textContent = p.name;
  qs("#pMeta").textContent = `${p.sex} · approx. age ${p.approxAge} · ${missionForCode(p.country).country}` +
    (p.allergies.length ? ` · allergies: ${p.allergies.join(", ")}` : " · no known allergies");
  qs("#pCategory").textContent = categoryLabel(v.category);
  qs("#pComplaint").textContent = `"${v.complaint}"`;
  qs("#pVitals").textContent = `BP ${v.vitals.bp || "—"} · Temp ${v.vitals.temp || "—"}°C · Weight ${v.vitals.weight || "—"}kg · Height ${v.vitals.height || "—"}cm`;

  const prior = priorVisits(p);
  const hist = qs("#historySection");
  if(prior.length){
    hist.innerHTML = `<h3 style="margin-top:14px;">Visit history</h3><ol class="queue-list">` + prior.slice().reverse().map(pv => `
      <li class="tl-item">
        <div class="tl-date">${esc(pv.year)}</div>
        <div class="small">"${esc(pv.complaint)}" — ${esc(pv.diagnosis || "no diagnosis recorded")}.
        ${pv.prescription.length ? "Prescribed: " + esc(pv.prescription.map(sku => (INVENTORY_SEED.find(i=>i.sku===sku)||{}).name || sku).join(", ")) + "." : "No medication given."}</div>
      </li>
    `).join("") + `</ol>`;
  } else {
    hist.innerHTML = `<p class="small muted" style="margin-top:10px;">No prior visits on file — new patient.</p>`;
  }

  qs("#diagText").value = "";
  qs("#transcript").textContent = "Tap the mic, or type below.";
  qs("#labOrder").checked = false;
  qs("#labOrder").setAttribute("aria-expanded", "false");
  qs("#labResultField").style.display = "none";
  qs("#labResult").value = "";

  const rx = qs("#rxOptions");
  rx.innerHTML = "";
  db_getInventory().forEach(item => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn-secondary";
    b.style.fontSize = "13px";
    b.style.padding = "8px 12px";
    b.textContent = item.name;
    b.dataset.sku = item.sku;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      const on = b.classList.toggle("btn-primary");
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    rx.appendChild(b);
  });

  const micBtn = qs("#micBtn");
  const newMic = micBtn.cloneNode(true);
  micBtn.parentNode.replaceChild(newMic, micBtn);
  attachSpeechToText(newMic, qs("#transcript"), {
    lang: "en-US",
    onInterim: (text) => qs("#diagText").value = text,
    onFinal: (text) => qs("#diagText").value = text
  });

  renderQueue();
  focusEl(qs("#pName"));
}

qs("#labOrder").addEventListener("change", (e) => {
  qs("#labResultField").style.display = e.target.checked ? "block" : "none";
  e.target.setAttribute("aria-expanded", e.target.checked ? "true" : "false");
});

qs("#ordersForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if(!current) return;
  const v = latestVisit(current);
  v.diagnosis = qs("#diagText").value.trim();
  v.labOrdered = qs("#labOrder").checked;
  if(v.labOrdered) v.labResult = qs("#labResult").value.trim();
  const chosenSkus = qsa('#rxOptions [aria-pressed="true"]').map(b => b.dataset.sku);
  v.prescription = chosenSkus;
  // the visit object was mutated in place above; persist the whole patient record back to storage
  db_savePatient(current);

  if(chosenSkus.length){
    db_moveToStation(current.id, "pharmacy");
    toast(current.name + " sent to pharmacy");
  } else {
    db_removeFromQueue(current.id);
    toast(current.name + "'s visit completed");
  }
  qs("#chartCard").style.display = "none";
  qs("#emptyState").style.display = "block";
  current = null;
  renderQueue();
  focusEl(qs("#queueHeading"));
});

renderQueue();
setInterval(renderQueue, 4000);
</script>
</body>
</html>
