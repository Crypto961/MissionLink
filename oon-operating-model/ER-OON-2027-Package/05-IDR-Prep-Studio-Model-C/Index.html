      });
      updateProgress();

      if (app.querySelector('#filed')) {
        app.querySelector('#filed').addEventListener('click', function () {
          var no = app.querySelector('#portal-no').value.trim().toUpperCase();
          if (!/^DISP-\d{7}$/.test(no)) { toast('Enter the portal dispute number, like DISP-1234567.', true); return; }
          var f = app.querySelector('#portal-pdf').files[0];
          if (!f) { toast('Attach the portal confirmation PDF.', true); return; }
          busy(true);
          readAsBase64(f).then(function (b) { return call('markFiled', S.id, no, { name: f.name, mimeType: f.type, data: b }); })
            .then(function (b) { apply(b); busy(false); toast('Marked as filed'); renderDesk(); }).catch(fail);
        });
        app.querySelector('#return').addEventListener('click', function () {
          var reason = app.querySelector('#reason').value.trim();
          var details = app.querySelector('#details').value.trim();
          if (!reason) { toast('Pick a reason for returning the dispute.', true); return; }
          var s = closestOption(S.boot.options.ReturnReason || [], reason);
          if (s && confirm('Did you mean "' + s + '"? OK uses "' + s + '", Cancel keeps "' + reason + '".')) reason = s;
          busy(true);
          call('returnDispute', S.id, reason, details).then(function () { S.lists = {}; busy(false); toast('Returned to Lebanon'); S.view = 'list'; S.filter = 'Ready for US desk'; render(); }).catch(fail);
        });
      }
    }

    function updateProgress() {
      var c = deskCounts();
      var t = app.querySelector('#prog-text'), bar = app.querySelector('#prog-bar');
      if (!t) return;
      t.textContent = c.done + ' of ' + c.all + ' fields copied on this view';
      bar.style.width = (c.all ? Math.round(c.done / c.all * 100) : 0) + '%';
    }

    // ---------------------------------------------------------------- Insights (trends during training)

    function shareBar(pct) { return '<div class="share" title="' + pct + '%"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>'; }

    function renderInsights() {
      app.innerHTML = '<div class="list-head"><div><button class="link" id="exit">← All disputes</button><h1>Insights</h1>' +
        '<p class="sub">What the app has learned from saved disputes: the values used most, the defaults it now suggests, and what was added this week.</p></div></div>' +
        '<div id="ins"><p class="muted">Loading…</p></div>';
      app.querySelector('#exit').addEventListener('click', function () { S.view = 'list'; render(); });
      call('getInsights').then(function (r) {
        if (S.view !== 'insights') return;
        var st = r.settings;
        var h = '<div class="card"><b>Learning mode: ' + esc(st.LearningMode) + '</b> · ' +
          esc(st.LearningMode === 'On' ? 'training phase: new values are used at once.' : 'new values wait for an admin in Lists.') +
          ' · ' + esc(r.addedThisWeek) + ' new value(s) this week · defaults need ' + Math.round(st.DefaultShare * 100) + '% of the last ' + esc(st.DefaultWindow) + ' saves.</div>';
        h += '<div class="card" style="margin-top:16px"><h2>Defaults now suggested</h2><div style="overflow-x:auto"><table class="grid"><tr><th>Field</th><th>Default</th><th>From</th><th>Share of recent saves</th><th>Saves looked at</th></tr>' +
          r.defaults.map(function (d) {
            return '<tr><td>' + esc(d.label) + '</td><td>' + (d.value === '' ? '<span class="muted">(blank)</span>' : esc(d.value)) + '</td><td>' +
              (d.source === 'learned' ? '<span class="chip learned">learned</span>' : '<span class="chip">seed</span>') + '</td><td>' +
              shareBar(Math.round(d.share * 100)) + ' <span class="muted">' + Math.round(d.share * 100) + '%</span></td><td>' + esc(d.sample) + '</td></tr>';
          }).join('') + '</table></div></div>';
        h += '<div class="ins-grid">' + r.lists.map(function (l) {
          return '<div class="card"><h2>' + esc(l.list) + '</h2><p class="muted" style="margin:0 0 8px">' + esc(l.values) + ' value(s) · ' + esc(l.total) + ' use(s) · ' +
            esc(l.addedThisWeek) + ' new this week' + (l.pending ? ' · <b>' + esc(l.pending) + ' waiting for an admin</b>' : '') + '</p>' +
            (l.top.length ? '<table class="grid"><tr><th>Value</th><th>Uses</th><th>Share</th></tr>' + l.top.map(function (t) {
              return '<tr><td>' + esc(t.value) + (t.label ? '<div class="muted">' + esc(t.label) + '</div>' : '') + '</td><td>' + esc(t.count) + '</td><td>' + shareBar(t.share) + ' <span class="muted">' + esc(t.share) + '%</span></td></tr>';
            }).join('') + '</table>' : '<p class="muted">Nothing yet.</p>') + '</div>';
        }).join('') + '</div>';
        app.querySelector('#ins').innerHTML = h;
      }).catch(fail);
    }

    // ---------------------------------------------------------------- Lists (admins)

    function renderAdmin() {
      app.innerHTML = '<div class="list-head"><div><button class="link" id="exit">← All disputes</button><h1>Lists</h1>' +
        '<p class="sub">Rename, merge, hide or reactivate list values. Hidden values are never suggested. Merging moves the uses into the other value.</p></div></div>' +
        '<div id="adm"><p class="muted">Loading…</p></div>';
      app.querySelector('#exit').addEventListener('click', function () {
        // Pick up the changes in the entry screens.
        call('getBootstrap', false).then(function (b) { setBoot(Object.assign({}, b, { list: null })); }).catch(function () {});
        S.view = 'list'; render();
      });
      call('adminListOptions', S.admin.list || '').then(showAdmin).catch(fail);
    }

    function showAdmin(r) {
      S.admin.data = r;
      var box = app.querySelector('#adm');
      if (!box || S.view !== 'admin') return;
      var h = '<div class="admin-layout"><div class="admin-lists">' + r.lists.map(function (l) {
        return '<button data-list="' + esc(l.list) + '" class="' + (l.list === S.admin.list ? 'on' : '') + '">' + esc(l.list) +
          ' <span class="muted">(' + esc(l.active) + (l.hidden ? ' + ' + esc(l.hidden) + ' hidden' : '') + ')</span></button>';
      }).join('') + '</div><div>';
      if (!r.rows) {
        h += '<div class="card">Pick a list. Learning mode is <b>' + esc(r.learningMode) + '</b>' +
          (r.learningMode === 'Off' ? ': new values typed by users wait here as Hidden until you activate them.' : ': new values are active at once (training phase).') +
          ' Change it in the Settings tab.</div>';
      } else {
        var active = r.rows.filter(function (x) { return x.status !== 'Hidden'; }).map(function (x) { return x.value; });
        h += '<datalist id="dl_admin">' + active.map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('') + '</datalist>' +
          '<div style="overflow-x:auto"><table class="grid"><tr><th>Value</th><th>Label</th><th>Uses</th><th>Last used</th><th>Source</th><th>Status</th><th>Actions</th></tr>' +
          r.rows.map(function (x, i) {
            return '<tr class="' + (x.status === 'Hidden' ? 'hidden-row' : '') + '" data-i="' + i + '"><td><b>' + esc(x.value) + '</b>' +
              (x.similar ? '<div class="muted">Looks like: ' + esc(x.similar) + '</div>' : '') +
              (x.mergedInto ? '<div class="muted">Merged into: ' + esc(x.mergedInto) + '</div>' : '') + '</td>' +
              '<td><input type="text" data-label value="' + esc(x.label) + '"></td><td>' + esc(x.count) + '</td><td>' + esc(x.lastUsed) + '</td><td>' + esc(x.source) +
              '<div class="muted">' + esc(x.addedBy) + '</div></td><td>' + esc(x.status) + '</td>' +
              '<td><div class="row-actions"><button class="secondary" data-act="label">Save label</button>' +
              '<button class="ghost" data-act="status">' + (x.status === 'Hidden' ? 'Activate' : 'Hide') + '</button>' +
              '<input type="text" data-merge list="dl_admin" placeholder="Merge into…" value="' + esc(x.similar) + '" style="max-width:160px">' +
              '<button class="ghost" data-act="merge">Merge</button></div></td></tr>';
          }).join('') + '</table></div>';
      }
      box.innerHTML = h + '</div></div>';
      box.querySelectorAll('[data-list]').forEach(function (b) {
        b.addEventListener('click', function () {
          S.admin.list = b.getAttribute('data-list');
          busy(true);
          call('adminListOptions', S.admin.list).then(function (d) { busy(false); showAdmin(d); }).catch(fail);
        });
      });
      box.querySelectorAll('[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr');
          var x = r.rows[Number(tr.getAttribute('data-i'))];
          var act = b.getAttribute('data-act');
          var change = {};
          if (act === 'label') change.label = tr.querySelector('[data-label]').value.trim();
          if (act === 'status') change.status = x.status === 'Hidden' ? 'Active' : 'Hidden';
          if (act === 'merge') {
            change.mergeInto = tr.querySelector('[data-merge]').value.trim();
            if (!change.mergeInto) { toast('Type the value to merge into.', true); return; }
            if (!confirm('Merge "' + x.value + '" into "' + change.mergeInto + '"? Its ' + x.count + ' use(s) move there and it is hidden.')) return;
          }
          busy(true);
          call('adminUpdateOption', S.admin.list, x.value, change).then(function (d) { busy(false); toast('Saved'); showAdmin(d); }).catch(fail);
        });
      });
    }

    // ---------------------------------------------------------------- start

    function showError(message) {
      loader.classList.remove('loaded');
      loader.innerHTML = '<div class="error-msg"></div>';
      loader.firstChild.textContent = 'Something went wrong loading this page: ' + message;
    }

    function setBoot(boot) {
      boot.lists = boot.lists || {};
      boot.options = {};
      Object.keys(boot.lists).forEach(function (k) { boot.options[k] = boot.lists[k].map(function (o) { return o.v; }); });
      S.boot = boot;
      S.hol = null;
    }

    // The first screen's data is built into the page; the server call is only a fallback.
    (BOOT && !BOOT.error ? Promise.resolve(BOOT) : call('getBootstrap', true)).then(function (boot) {
      setBoot(boot);
      document.getElementById('who').innerHTML = esc(boot.user) + (boot.isUsDesk ? '<span class="desk-pill">US desk</span>' : '') +
        (boot.isAdmin ? '<span class="desk-pill">Admin</span>' : '');
      if (boot.isUsDesk) S.filter = 'Ready for US desk';
      if (boot.list && boot.listFilter === S.filter) S.lists[S.filter] = { rows: boot.list, at: Date.now() };
      render();
      setTimeout(function () { loader.classList.add('loaded'); }, 300);
    }).catch(function (e) { showError(e.message || String(e)); });
  })();
  </script>
</body>
</html>
