      h += '<div class="card page-card"><div class="mirror">Portal page: ' + esc(sc.review.step) + '</div><p style="margin:0">Expand each section and check it, then select <b>Submit</b>. ' +
        'On the confirmation page select <b>Save as PDF</b>, and send the non-initiating party a copy of the Notice of IDR Initiation <b>the same day</b>.</p></div>';

      if (S.d.Status !== 'Filed') {
        h += '<div class="card"><div class="finish"><div><b>Filed in the portal</b>' +
          '<input type="text" id="portal-no" placeholder="Portal dispute number, like DISP-1234567" autocomplete="off">' +
          '<div class="lbl" style="font-size:13px;font-weight:600"><span class="req">*</span> Notice of IDR Initiation PDF (Save as PDF in the portal)</div><input type="file" id="portal-pdf" accept="application/pdf" style="margin:6px 0 12px">' +
          '<div class="lbl" style="font-size:13px;font-weight:600"><span class="req">*</span> Copy of the notice sent to the non-initiating party on</div><input type="date" id="nip-date" value="' + esc(today()) + '" max="' + esc(today()) + '">' +
          '<div class="lbl" style="font-size:13px;font-weight:600"><span class="req">*</span> Sent by</div><select id="nip-method"><option value="">Select</option>' +
          listValues('NipMethod').map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select>' +
          '<div><button class="success" id="filed"' + lockAttr + '>Mark as filed</button></div></div>' +
          '<div><b>Something is wrong</b>' +
          '<input type="text" id="reason" list="dl_return" placeholder="Reason" autocomplete="off"><datalist id="dl_return">' +
          entries('ReturnReason').map(function (o) { return '<option value="' + esc(o.v) + '"></option>'; }).join('') + '</datalist>' +
          '<textarea id="details" rows="3" placeholder="What needs fixing in Lebanon"></textarea>' +
          '<button class="danger" id="return">Return to Lebanon</button></div></div></div>';
      } else {
        h += '<div class="okbox">Filed by ' + esc(S.d.FiledBy) + ' on ' + esc(S.d.FiledAt) + '. Portal dispute number: <b>' + esc(S.d.PortalDisputeNumber) + '</b>' +
          (S.d.PortalPdfUrl ? ' · <a target="_blank" rel="noopener" href="' + esc(S.d.PortalPdfUrl) + '">Notice of IDR Initiation</a>' : '') +
          '<br>Notice sent to the non-initiating party: ' + esc(usDate(S.d.nip_notified_date) || 'not recorded') + (S.d.nip_notified_method ? ' by ' + esc(S.d.nip_notified_method) : '') + '</div>';
        if (S.boot.isUsDesk) {
          h += '<div class="card" style="margin-top:16px"><b>Certified IDR entity selection</b> <span class="muted">(optional tracking)</span>' +
            '<div class="finish" style="margin-top:8px"><div><input type="text" id="idre-final" list="dl_idre" placeholder="Final certified IDR entity" value="' + esc(S.d.idre_final || S.d.idr_entity || '') + '" autocomplete="off">' +
            '<datalist id="dl_idre">' + entries('IdrEntity').map(function (o) { return '<option value="' + esc(o.v) + '"></option>'; }).join('') + '</datalist></div>' +
            '<div><select id="idre-status">' + listValues('IdreStatus').map(function (s) { return '<option' + (s === (S.d.idre_status || optValue('IdreStatus', 'pending')) ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
            '</select></div></div><button class="secondary" id="idre-save">Save selection</button></div>';
        }
      }

      app.innerHTML = h;
      app.querySelector('#exit').addEventListener('click', function () { S.view = 'list'; render(); });
      if (app.querySelector('#to-editor')) app.querySelector('#to-editor').addEventListener('click', function () { S.view = 'edit'; S.page = 6; render(); });
      app.querySelectorAll('[data-line-tab]').forEach(function (b) {
        b.addEventListener('click', function () { S.deskLine = Number(b.getAttribute('data-line-tab')); var y = window.scrollY; renderDesk(); window.scrollTo(0, y); });
      });
      app.querySelectorAll('[data-copy]').forEach(function (b) {
        b.addEventListener('click', function () {
          var key = b.getAttribute('data-copy');
          copyText(b.getAttribute('data-value')).then(function () {
            S.copied[key] = true;
            b.closest('.crow').classList.add('copied');
            b.textContent = 'Copied ✓';
            updateProgress();
          }).catch(function (e) { toast(e.message, true); });
        });
      });
      updateProgress();
      var st = app.querySelector('#start-timer');
      if (st) st.addEventListener('click', function () {
        stopTimer();
        S.timer = { start: Date.now(), warned: false };
        S.timer.h = setInterval(tickTimer, 1000);
        st.textContent = 'Restart timer';
        tickTimer();
      });
      if (S.timer) tickTimer();

      if (app.querySelector('#filed')) {
        app.querySelector('#filed').addEventListener('click', function () {
          var no = app.querySelector('#portal-no').value.trim().toUpperCase();
          if (!/^DISP-\d+$/.test(no)) { toast('Enter the portal dispute number, like DISP-1234567.', true); return; }
          var f = app.querySelector('#portal-pdf').files[0];
          if (!f) { toast('Attach the Notice of IDR Initiation PDF.', true); return; }
          var nDate = app.querySelector('#nip-date').value, nMethod = app.querySelector('#nip-method').value;
          if (!nDate || !nMethod) { toast('Enter when and how the non-initiating party was sent the notice.', true); return; }
          if (nDate !== today() && !confirm('The notice must be sent to the non-initiating party the same day the dispute is submitted. Record ' + usDate(nDate) + ' anyway?')) return;
          busy(true);
          readAsBase64(f).then(function (b) { return call('markFiled', S.id, no, { name: f.name, mimeType: f.type, data: b }, { date: nDate, method: nMethod }); })
            .then(function (b) { apply(b); busy(false); stopTimer(); toast('Marked as filed'); renderDesk(); }).catch(fail);
        });
        app.querySelector('#return').addEventListener('click', function () {
          var reason = app.querySelector('#reason').value.trim();
          var details = app.querySelector('#details').value.trim();

        });

        call('updateIdreSelection', S.id, app.querySelector('#idre-final').value.trim(), app.querySelector('#idre-status').value)
          .then(function (b) { apply(b); busy(false); toast('Saved'); renderDesk(); }).catch(fail);
      });
    }

    function updateProgress() {
      var c = deskCounts();
      var t = app.querySelector('#prog-text'), bar = app.querySelector('#prog-bar');
      if (!t) return;
      t.textContent = c.done + ' of ' + c.all + ' fields copied on this view';
      bar.style.width = (c.all ? Math.round(c.done / c.all * 100) : 0) + '%';
    }

    // ---------------------------------------------------------------- Insights (trends during training)

              '<td><div class="row-actions"><button class="secondary" data-act="save">Save</button>' +
              '<button class="ghost" data-act="status">' + (x.status === 'Hidden' ? 'Activate' : 'Hide') + '</button>' +
              (x.key && r.strict ? '' : '<input type="text" data-merge list="dl_admin" placeholder="Merge into…" value="' + esc(x.similar) + '" style="max-width:150px">' +
              '<button class="ghost" data-act="merge">Merge</button>') + '</div></td></tr>';
          }).join('') + '</table></div>';
      }
      box.innerHTML = h + '</div></div>';
      box.querySelectorAll('[data-list]').forEach(function (b) {
        b.addEventListener('click', function () {
          S.admin.list = b.getAttribute('data-list');
          busy(true);
          call('adminListOptions', S.admin.list).then(function (d) { busy(false); showAdmin(d); }).catch(fail);
        });
      });
      box.querySelectorAll('[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr');
          var x = r.rows[Number(tr.getAttribute('data-i'))];
          var act = b.getAttribute('data-act');
          var change = {};
          if (act === 'save') {
            change.label = tr.querySelector('[data-label]').value.trim();
            change.sort = tr.querySelector('[data-sort]').value.trim();
            var nv = tr.querySelector('[data-value]').value.trim();
            if (nv !== x.value) {
              if (!confirm('Reword "' + x.value + '" as "' + nv + '"? Saved disputes keep the old text.')) return;
              change.value = nv;
            }
          }
          if (act === 'status') change.status = x.status === 'Hidden' ? 'Active' : 'Hidden';
          if (act === 'merge') {
            change.mergeInto = tr.querySelector('[data-merge]').value.trim();
            if (!change.mergeInto) { toast('Type the value to merge into.', true); return; }
            if (!confirm('Merge "' + x.value + '" into "' + change.mergeInto + '"? Its ' + x.count + ' use(s) move there and it is hidden.')) return;
          }
          adminSave('adminUpdateOption', [S.admin.list, x.value, change], showAdmin);
        });
      });
    }

    // ---- Users
    function showUsers(r) {
      var box = admBox();
      if (!box || S.admin.tab !== 'users') return;
      var row = function (u, i) {
        return '<tr data-i="' + i + '"><td>' + (u.email ? '<b>' + esc(u.email) + '</b>' : inp('data-email', '')) + '</td><td>' + inp('data-name', u.name) + '</td><td>' +
          sel('data-role', r.roles, u.role || 'LB Member') + '</td><td>' + inp('data-team', u.team, 120) + '</td><td>' + sel('data-active', ['Yes', 'No'], u.active === false ? 'No' : 'Yes') +
          '</td><td>' + inp('data-notes', u.notes) + '</td><td><button class="secondary" data-save>' + (u.email ? 'Save' : 'Add') + '</button></td></tr>';
      };
      var rows = r.users.concat([{ email: '', name: '', role: 'LB Member', team: '', active: true, notes: '' }]);
      box.innerHTML = '<div class="card" style="margin-bottom:12px">Roles: <b>Admin</b> (everything, plus these views), <b>LB Member</b> (prepares Draft and Returned disputes, sends them to the US desk), ' +
        '<b>US Member</b> (copy desk, files, returns). Members are never deleted: set Active to No. The last active Admin cannot be removed or given another role.</div>' +
        '<div style="overflow-x:auto"><table class="grid edit"><tr><th>Email</th><th>Name</th><th>Role</th><th>Team</th><th>Active</th><th>Notes</th><th></th></tr>' +
        rows.map(row).join('') + '</table></div>';
      box.querySelectorAll('[data-save]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr'), u = rows[Number(tr.getAttribute('data-i'))];
          var q = function (a) { var el = tr.querySelector('[' + a + ']'); return el ? el.value.trim() : ''; };
          adminSave('adminSaveUser', [{ email: u.email || q('data-email'), name: q('data-name'), role: q('data-role'), team: q('data-team'),
            active: q('data-active') === 'Yes', notes: q('data-notes') }], showUsers);
        });
      });
    }

    // ---- Billing entities
    var ENTITY_EDIT = ['Name', 'ActingAs', 'TIN', 'NPI', 'GroupName', 'Addr1', 'Addr2', 'City', 'State', 'ZIP', 'Email', 'Phone', 'Fax', 'Confirmed', 'Status', 'Aliases', 'Notes'];
    function showEntities(r) {
      var box = admBox();
      if (!box || S.admin.tab !== 'entities') return;
      var cell = function (c, v) {
        if (c === 'ActingAs') return sel('data-c="ActingAs"', [''].concat(r.actingAs), v);
        if (c === 'State') return sel('data-c="State"', [''].concat(r.states), v);
        if (c === 'Confirmed') return sel('data-c="Confirmed"', ['Yes', 'No'], v || 'No');
        if (c === 'Status') return sel('data-c="Status"', ['Active', 'Hidden'], v || 'Active');
        return inp('data-c="' + c + '"', v, c === 'State' || c === 'ZIP' ? 90 : 0);
      };
      var rows = r.rows.concat([{ Name: '' }]);
      box.innerHTML = '<div class="card" style="margin-bottom:12px">The initiating party address book. Picking an entity fills I am a(n), Tax ID, NPI, the group name and the contact details. ' +
        'Saving a dispute fills empty columns and counts uses; it never overwrites what you enter here. Renaming keeps the old name as an alias.</div>' +
        '<div style="overflow-x:auto"><table class="grid edit"><tr>' + ENTITY_EDIT.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '<th>Uses</th><th></th></tr>' +
        rows.map(function (e, i) {
          return '<tr data-i="' + i + '"' + (String(e.Status).toLowerCase() === 'hidden' ? ' class="hidden-row"' : '') + '>' +
            ENTITY_EDIT.map(function (c) { return '<td>' + cell(c, e[c] == null ? '' : e[c]) + '</td>'; }).join('') +
            '<td>' + esc(e.Count || '') + '</td><td><button class="secondary" data-save>' + (e.Name ? 'Save' : 'Add') + '</button></td></tr>';
        }).join('') + '</table></div>';
      box.querySelectorAll('[data-save]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr'), e = rows[Number(tr.getAttribute('data-i'))];
          var out = {};
          tr.querySelectorAll('[data-c]').forEach(function (el) { out[el.getAttribute('data-c')] = el.value.trim(); });
          adminSave('adminSaveEntity', [out, e.Name || ''], showEntities);
        });
      });
    }

    // ---- Settings & fields
    function showConfig(r) {
      var box = admBox();
      if (!box || S.admin.tab !== 'config') return;
      var h = (r.warnings.length ? warnBox(r.warnings, 'Configuration problems (the built-in values are used instead):') + '<br>' : '') +
        '<h2>Settings</h2><div style="overflow-x:auto"><table class="grid edit"><tr><th>Key</th><th>Value</th><th>In use</th><th>What it does</th><th></th></tr>' +
        r.settings.map(function (x, i) {
          return '<tr data-i="' + i + '"><td><b>' + esc(x.key) + '</b></td><td>' + inp('data-v', x.value, 160) + '</td><td>' + esc(x.effective) + '</td><td class="muted">' + esc(x.note) +
            '</td><td><button class="secondary" data-set>Save</button></td></tr>';
        }).join('') + '</table></div>';
      var lists = r.lists || {};
      h += '<h2 style="margin-top:22px">Fields</h2><p class="muted">Required = Rule means the portal rule is in the code (it depends on other answers). ' +
        'Default mode: Fixed uses the default; Learned uses the value most saves used, or the default; None leaves the field empty. Locked shows a fixed default as a chip.</p>' +
        '<div style="overflow-x:auto"><table class="grid edit"><tr><th>Page</th><th>Key</th><th>Label</th><th>Help</th><th>Required</th><th>Default</th><th>Mode</th><th>Locked</th><th>Visible</th><th>Order</th><th></th></tr>' +
        r.fields.map(function (f, i) {
          var dl = f.list && lists[f.list] ? ' list="dl_cfg_' + esc(f.list) + '"' : '';
          return '<tr data-i="' + i + '"><td>' + esc(f.page) + '</td><td>' + esc(f.key) + '<div class="muted">' + esc(f.type) + (f.list ? ' · ' + esc(f.list) : '') + '</div></td><td>' +
            inp('data-label', f.label) + '</td><td>' + inp('data-help', f.help) + '</td><td>' +
            (f.rule ? 'Rule' : sel('data-req', ['Yes', 'No'], f.required)) + '</td><td><input type="text" data-def value="' + esc(f.default) + '"' + dl + ' style="max-width:150px"></td><td>' +
            sel('data-mode', r.defaultModes, f.defaultMode) + '</td><td>' + sel('data-locked', ['No', 'Yes'], f.locked ? 'Yes' : 'No') + '</td><td>' +
            sel('data-vis', ['Yes', 'No'], f.visible ? 'Yes' : 'No') + '</td><td>' + inp('data-order', f.order, 50) + '</td><td><button class="secondary" data-field>Save</button></td></tr>';
        }).join('') + '</table></div>' +
        Object.keys(lists).map(function (l) { return '<datalist id="dl_cfg_' + esc(l) + '">' + lists[l].map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('') + '</datalist>'; }).join('');
      box.innerHTML = h;
      box.querySelectorAll('[data-set]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr'), x = r.settings[Number(tr.getAttribute('data-i'))];
          adminSave('adminSaveSetting', [x.key, tr.querySelector('[data-v]').value.trim()], showConfig);
        });
      });
      box.querySelectorAll('[data-field]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr'), f = r.fields[Number(tr.getAttribute('data-i'))];
          var q = function (a) { var el = tr.querySelector('[' + a + ']'); return el ? el.value.trim() : null; };
          var change = { label: q('data-label'), help: q('data-help'), default: q('data-def'), defaultMode: q('data-mode'), locked: q('data-locked'),
            visible: q('data-vis'), order: q('data-order') };
          if (!f.rule) change.required = q('data-req');
          adminSave('adminSaveField', [f.key, change], showConfig);
        });
      });
    }

    // ---------------------------------------------------------------- start

    function showError(message) {
      loader.classList.remove('loaded');
      loader.innerHTML = '<div class="error-msg"></div>';
      loader.firstChild.textContent = 'Something went wrong loading this page: ' + message;
    }

    function setBoot(boot) {
      boot.lists = boot.lists || {};
      boot.options = {};
      Object.keys(boot.lists).forEach(function (k) { boot.options[k] = boot.lists[k].map(function (o) { return o.v; }); });
      S.boot = boot;
      S.hol = null;
    }

    // The first screen's data is built into the page; the server call is only a fallback.
    (BOOT && !BOOT.error ? Promise.resolve(BOOT) : call('getBootstrap', true)).then(function (boot) {
      setBoot(boot);
      document.getElementById('who').innerHTML = esc(boot.me.name || boot.user) + '<span class="desk-pill">' + esc(boot.role) + '</span>';
      if (boot.role === 'US Member') S.filter = 'Ready for US desk';
      if (boot.list && boot.listFilter === S.filter) S.lists[S.filter] = { rows: boot.list, at: Date.now() };
      render();
      setTimeout(function () { loader.classList.add('loaded'); }, 300);
    }).catch(function (e) { showError(e.message || String(e)); });
  })();
  </script>
</body>
</html>
