<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><?= APP_NAME ?></title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-navy: #003B5C;
      --primary-cyan: #00A3E0;
      --functional-red: #E31B23;
      --success-green: #10B981;
      --warning-gold: #F59E0B;
      --neutral-slate: #94A3B8;
      --white: #FFFFFF;
      --page: #F8FAFC;
      --line: #DCE3EA;
      --text-2: #475569;
      --cyan-tint: #E3F5FC;
      --green-tint: #E3F8F0;
      --red-tint: #FDE8E9;
      --gold-tint: #FEF3DC;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: var(--page); color: var(--primary-navy); font-size: 14px; line-height: 1.45; }

    /* --- Immersive Minimalist Loader --- */
    #loader-wrapper {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(248, 250, 252, 0.85);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader-wrapper.loaded { opacity: 0; visibility: hidden; }
    .spinner { position: relative; width: 60px; height: 60px; }
    .spinner-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid transparent; }
    .spinner-ring:nth-child(1) { border-top-color: var(--primary-cyan); animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
    .spinner-ring:nth-child(2) { border-bottom-color: var(--primary-navy); width: 80%; height: 80%; top: 10%; left: 10%; animation: spin-reverse 1s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
    .loader-text { margin-top: 20px; font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--primary-navy); animation: pulse-opacity 1.5s ease-in-out infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes pulse-opacity { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .error-msg { color: var(--functional-red); font-weight: bold; padding: 20px; text-align: center; background: var(--white); border-radius: 8px; box-shadow: 0 4px 15px rgba(227, 27, 35, 0.2); max-width: 600px; word-wrap: break-word; animation: none; }

    /* --- Shell --- */
    header.top { background: var(--primary-navy); color: var(--white); }
    .top-in { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .logo { height: 40px; max-width: 160px; object-fit: contain; background: var(--white); border-radius: 8px; padding: 4px 10px; }
    .app-name { font-weight: 800; font-size: 17px; }
    .who { margin-left: auto; font-size: 12px; color: #C8D6E0; }
    .desk-pill { background: var(--primary-cyan); color: var(--white); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; margin-left: 6px; }
    .internal { background: var(--gold-tint); color: #6B4A00; font-weight: 600; font-size: 13px; text-align: center; padding: 8px 16px; border-bottom: 1px solid #F3D9A4; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }

    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    h3 { font-size: 15px; margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
    h3:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
    .sub { color: var(--text-2); margin: 0 0 16px; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 22px; box-shadow: 0 6px 24px rgba(0, 59, 92, 0.06); }
    .muted { color: var(--neutral-slate); }
    .hidden { display: none !important; }

    button, .btn { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .primary { background: var(--primary-navy); color: var(--white); }
    .primary:hover { background: var(--primary-cyan); }
    .secondary { background: #E6EEF3; color: var(--primary-navy); }
    .ghost { background: transparent; border: 1px solid var(--line); color: var(--text-2); }
    .success { background: var(--success-green); color: var(--white); }
    .danger { background: var(--white); border: 1px solid var(--functional-red); color: var(--functional-red); }
    .link { background: none; padding: 0; color: var(--primary-cyan); font-weight: 600; }

    /* list */
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filters button { background: var(--white); border: 1px solid var(--line); color: var(--text-2); padding: 7px 12px; font-size: 13px; }
    .filters button.on { background: var(--primary-navy); color: var(--white); border-color: var(--primary-navy); }
    table.grid { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    table.grid th { text-align: left; background: var(--primary-navy); color: var(--white); font-size: 12px; letter-spacing: 0.5px; padding: 10px 12px; }
    table.grid td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
    table.grid tr.click { cursor: pointer; }
    table.grid tr.click:hover td { background: var(--cyan-tint); }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .b-draft { background: #E6EEF3; color: var(--primary-navy); }
    .b-ready { background: var(--cyan-tint); color: #006D96; }
    .b-filed { background: var(--green-tint); color: #0B7A57; }
    .b-returned { background: var(--red-tint); color: #B3121A; }

    /* wizard */
    .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
    .steps button { background: #E6EEF3; color: var(--text-2); font-size: 12px; padding: 8px 6px; border-radius: 8px; }
    .steps button.on { background: var(--primary-cyan); color: var(--white); }
    .steps button.done { background: var(--navy-tint, #D7E4EC); color: var(--primary-navy); }
    .steps button.locked { opacity: .55; cursor: not-allowed; }
    .mirror { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--primary-cyan); margin-bottom: 4px; }
    .req-note { font-size: 13px; color: var(--text-2); margin: 0 0 14px; }
    .req { color: var(--functional-red); font-weight: 700; }
    .fields { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px 16px; }
    .f { grid-column: span 12; }
    .f.half { grid-column: span 6; }
    .f.third { grid-column: span 4; }
    .f.quarter { grid-column: span 3; }
    .f > label, .f > .lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .f input[type=text], .f input[type=email], .f input[type=date], .f select, .f textarea {
      width: 100%; padding: 9px 10px; border: 1px solid #C5D0DA; border-radius: 8px; font: inherit; color: var(--primary-navy); background: var(--white);
    }
    .f textarea { min-height: 70px; resize: vertical; }
    .f input:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--primary-cyan); outline-offset: 0; border-color: var(--primary-cyan); }
    .f.err input, .f.err select, .f.err textarea { border-color: var(--functional-red); }
    .f .msg { color: var(--functional-red); font-size: 12px; margin-top: 4px; }
    .choices { display: grid; gap: 6px; }
    .choices label { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; font-size: 14px; }
    .choices input { margin-top: 3px; }
    .internal-box { background: var(--gold-tint); border-radius: 10px; padding: 14px; margin-bottom: 18px; }
    .internal-box .lbl { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #6B4A00; margin-bottom: 8px; }
    .upload { border: 2px dashed var(--line); border-radius: 10px; padding: 12px; background: #FBFCFD; }
    .upload .note { font-size: 12px; color: var(--text-2); margin-top: 6px; }
    .file-list { display: grid; gap: 4px; margin-top: 8px; }
    .file-list div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; background: var(--white); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
    .actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 22px; flex-wrap: wrap; }
    .actions .right { display: flex; gap: 8px; flex-wrap: wrap; }
    .problems { background: var(--red-tint); border-left: 4px solid var(--functional-red); border-radius: 8px; padding: 12px 16px; margin-top: 16px; }
    .problems ul { margin: 6px 0 0; padding-left: 18px; }
    .okbox { background: var(--green-tint); border-left: 4px solid var(--success-green); border-radius: 8px; padding: 12px 16px; margin-top: 16px; }
    .lines-mini { display: grid; gap: 6px; margin-bottom: 14px; }
    .lines-mini div { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #F8FAFC; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .warn { background: var(--gold-tint); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }

    /* copy desk */
    .desk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .progress { min-width: 220px; }
    .bar { height: 10px; background: #E6EEF3; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar i { display: block; height: 100%; background: var(--success-green); width: 0; transition: width 0.3s; }
    .page-card { margin-bottom: 16px; }
    .page-card .mirror { margin-bottom: 8px; }
    .crow { display: grid; grid-template-columns: 1.2fr 1.4fr auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
    .crow:first-of-type { border-top: 0; }
    .crow .l { font-size: 13px; color: var(--text-2); }
    .crow .v { font-weight: 600; word-break: break-word; }
    .crow.copied .v { color: #0B7A57; }
    .copy { background: var(--primary-navy); color: var(--white); padding: 6px 12px; font-size: 12px; min-width: 76px; }
    .crow.copied .copy { background: var(--success-green); }
    .crow .copy[disabled] { background: #E6EEF3; color: var(--neutral-slate); cursor: default; opacity: 1; }
    .tick-list { margin: 0; padding-left: 18px; font-weight: 600; }
    .sec-title { font-weight: 700; margin: 14px 0 4px; font-size: 14px; }
    .line-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .line-tabs button { background: #E6EEF3; color: var(--text-2); padding: 6px 10px; font-size: 12px; }
    .line-tabs button.on { background: var(--primary-cyan); color: var(--white); }
    .line-tabs button.complete { box-shadow: inset 0 -3px 0 var(--success-green); }
    .finish { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .finish input[type=text], .finish textarea { width: 100%; padding: 9px 10px; border: 1px solid #C5D0DA; border-radius: 8px; font: inherit; margin: 6px 0 10px; }
    .toast { position: fixed; right: 20px; bottom: 20px; background: var(--primary-navy); color: var(--white); padding: 12px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 50; max-width: 420px; }
    .toast.error { background: var(--functional-red); }
    #busybar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; overflow: hidden; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #busybar.on { opacity: 1; }
    #busybar::before { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--primary-cyan); animation: busy-slide 1s ease-in-out infinite; }
    @keyframes busy-slide { from { left: -35%; } to { left: 100%; } }

    /* learning: defaults, suggestions, address book */
    .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--cyan-tint); color: #006D96; margin-left: 6px; vertical-align: middle; }
    .chip.learned { background: var(--green-tint); color: #0B7A57; }
    .hint { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .hint:empty { display: none; }
    .hint.ask { background: var(--gold-tint); color: #6B4A00; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
    .hint .link { font-size: 12px; }
    .stop { background: var(--red-tint); border-left: 4px solid var(--functional-red); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-weight: 600; color: #B3121A; }
    .deadline { margin-top: 6px; font-size: 13px; background: var(--cyan-tint); border-radius: 8px; padding: 8px 10px; }
    .deadline:empty { display: none; }
    .deadline.red { background: var(--red-tint); color: #B3121A; font-weight: 600; }
    .poc.collapsed .fields { display: none; }
    .poc:not(.collapsed) .poc-toggle { display: none; }
    .poc-toggle { margin-left: 8px; font-size: 13px; }
    .sig { margin-top: 14px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
    .days-red { color: var(--functional-red); font-weight: 700; }
    .warn ul, .okbox ul { margin: 6px 0 0; padding-left: 18px; }
    .toast.warn { background: #8A5A00; }
    .share { height: 8px; background: #E6EEF3; border-radius: 999px; overflow: hidden; min-width: 70px; }
    .share i { display: block; height: 100%; background: var(--primary-cyan); }
    .ins-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
    .ins-grid .card { padding: 16px; }
    .ins-grid table.grid td, .ins-grid table.grid th { padding: 6px 8px; font-size: 13px; }
    .admin-layout { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
    .admin-lists { display: grid; gap: 4px; }
    .admin-lists button { text-align: left; background: var(--white); border: 1px solid var(--line); color: var(--text-2); padding: 7px 10px; font-size: 13px; }
    .admin-lists button.on { background: var(--primary-navy); color: var(--white); border-color: var(--primary-navy); }
    table.grid input[type=text] { width: 100%; min-width: 120px; padding: 6px 8px; border: 1px solid #C5D0DA; border-radius: 6px; font: inherit; }
    table.grid tr.hidden-row td { color: var(--neutral-slate); }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .row-actions button { padding: 5px 9px; font-size: 12px; }


    /* v3: 7-page stepper, sticky footer, locked chips, line grid, copy desk timer */
    .steps { grid-template-columns: repeat(7, 1fr); }
    .steps button { position: relative; line-height: 1.25; }
    .steps .st { display: block; font-size: 11px; font-weight: 700; margin-top: 2px; }
    .steps .st.ok { color: #0B7A57; }
    .steps .st.bad { color: #B3121A; }
    .steps button.on .st { color: var(--white); }
    .actions.sticky { position: sticky; bottom: 0; background: var(--white); border-top: 1px solid var(--line); margin: 22px -22px -22px; padding: 12px 22px; border-radius: 0 0 12px 12px; z-index: 5; }
    .keys { font-size: 12px; color: var(--neutral-slate); align-self: center; }
    .locked { display: inline-flex; gap: 8px; align-items: center; background: #EEF2F6; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-weight: 600; }
    .locked .lock { font-size: 11px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
    .chip.guess { background: var(--gold-tint); color: #6B4A00; }
    .note { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .opt-note { display: block; font-size: 12px; color: var(--text-2); font-weight: 400; }
    .f .msg .link { font-size: 12px; margin-left: 6px; }
    .poc-hint { font-size: 12px; color: var(--text-2); margin: -4px 0 8px; }
    .kind-note { background: var(--cyan-tint); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
    table.grid td.issues { white-space: nowrap; }
    table.grid.compact th, table.grid.compact td { padding: 7px 8px; font-size: 12px; }
    table.grid.compact .row-actions { flex-wrap: nowrap; }
    .ok-tick { color: #0B7A57; font-weight: 700; }
    .bad-count { color: #B3121A; font-weight: 700; }
    .line-form { border: 2px solid var(--primary-cyan); border-radius: 12px; padding: 18px; margin-top: 16px; background: #FBFDFE; }
    .paste textarea { width: 100%; min-height: 120px; font-family: monospace; font-size: 12px; padding: 8px; border: 1px solid #C5D0DA; border-radius: 8px; }
    .review-sec { border-top: 1px solid var(--line); padding: 12px 0; }
    .review-sec:first-of-type { border-top: 0; }
    .review-sec .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .kv { display: grid; grid-template-columns: minmax(180px, 1fr) 2fr; gap: 4px 14px; font-size: 13px; margin-top: 6px; }
    .kv .k { color: var(--text-2); }
    .banner { background: #FFF4E5; border: 1px solid #F3D9A4; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
    .session { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .timer { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .timer.warn { color: #8A5A00; }
    .timer.over { color: var(--functional-red); }
    .search-box { position: relative; }
    .dropdown { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: var(--white); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 20px rgba(0, 59, 92, 0.12); max-height: 260px; overflow-y: auto; }
    .dd-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 0; padding: 8px 10px; font-weight: 500; font-size: 13px; color: var(--primary-navy); }
    .dd-item:hover { background: var(--cyan-tint); }
    .dd-new { color: #006D96; font-weight: 700; border-top: 1px solid var(--line); }
    .dd-note { padding: 8px 10px; font-size: 12px; color: var(--text-2); }
    .admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .admin-tabs button { background: var(--white); border: 1px solid var(--line); color: var(--text-2); padding: 7px 12px; font-size: 13px; }
    .admin-tabs button.on { background: var(--primary-navy); color: var(--white); border-color: var(--primary-navy); }
    table.grid select { padding: 5px 6px; border: 1px solid #C5D0DA; border-radius: 6px; font: inherit; font-size: 12px; }
    table.grid.edit input[type=text] { min-width: 90px; font-size: 12px; padding: 5px 6px; }
    .finish select, .finish input[type=date] { width: 100%; padding: 9px 10px; border: 1px solid #C5D0DA; border-radius: 8px; font: inherit; margin: 6px 0 10px; }

    @media (max-width: 760px) {
      .f.half, .f.third, .f.quarter { grid-column: span 12; }
      .steps { grid-template-columns: repeat(2, 1fr); }
      .kv { grid-template-columns: 1fr; }
      .actions.sticky .keys { display: none; }
      .crow { grid-template-columns: 1fr auto; }
      .crow .l { grid-column: 1 / -1; }
      .finish { grid-template-columns: 1fr; }
      .admin-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="loader-wrapper" role="status" aria-live="polite">
    <div class="spinner"><div class="spinner-ring"></div><div class="spinner-ring"></div></div>
    <div class="loader-text">Loading</div>
  </div>

  <header class="top">
    <div class="top-in">
      <img class="logo" src="<?= LOGO_URL ?>" alt="Company logo"
           onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%2270%22%3E%3Crect width=%22180%22 height=%2270%22 rx=%2210%22 fill=%22%23E6EEF3%22/%3E%3Ctext x=%2290%22 y=%2242%22 font-family=%22Arial%22 font-size=%2216%22 font-weight=%22700%22 fill=%22%23003B5C%22 text-anchor=%22middle%22%3ELogo%3C/text%3E%3C/svg%3E';">
      <div class="app-name"><?= APP_NAME ?></div>
      <div class="who" id="who"></div>
    </div>
  </header>
  <div class="internal">Internal preparation tool. It mirrors the federal IDR Gateway web form page by page but is not the CMS portal: nothing here is sent to CMS.</div>

  <main id="app"></main>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="busybar" aria-hidden="true"></div>

  <script>
  (function () {
    // ---------------------------------------------------------------- state and server calls
    var BOOT = <?!= BOOT_JSON ?>;
    var S = { lists: {}, boot: null, view: 'list', filter: 'Draft', id: null, d: {}, lines: [], files: [], warnings: [], deadline: null,
      page: 0, line: null, copied: {}, deskLine: 0, defaulted: {}, pending: {}, unlocked: {}, admin: { list: '', data: null }, insights: null,
      paste: null, save: null, timer: null };
    var app = document.getElementById('app');
    var loader = document.getElementById('loader-wrapper');
    // The Studio's 7 pages follow the portal's pages.
    var PAGES = ['qual', 'dtype', 'init', 'noninit', 'lines', 'final', 'review'];
    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var MB = 1024 * 1024;

    function call(name) {
