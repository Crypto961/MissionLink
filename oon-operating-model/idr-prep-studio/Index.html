      return { onEnds: utcToIso(onEnds), opens: utcToIso(opens), initiateBy: utcToIso(by), daysLeft: left, b: b,
        band: b < 31 ? 'early' : b <= 34 ? 'window' : 'late' };
    }
    function timingProblem(d, todayIso) {
      var dl = bizDeadline(d.on_start_date, todayIso);
      if (!dl) return '';
      if (dl.band === 'late' && !String(d.extension_reason || '').trim()) return 'Deadline passed: the initiation window was ' + usDate(dl.opens) + ' to ' + usDate(dl.initiateBy) + '.';
      return '';
    }
    function deadlineText(onStart, rec) {
      var dl = bizDeadline(onStart);
      if (!dl) return '';
      var win = esc(portalDate(dl.opens)) + ' to ' + esc(portalDate(dl.initiateBy));
      if (dl.band === 'early') {
        return '<div class="deadline">Filing window opens <b>' + esc(portalDate(dl.opens)) + '</b> (today is open negotiation business day ' + dl.b + '). ' +
          'You can prepare it and send it to the US desk now; the US desk can file from ' + win + '.</div>';
      }
      if (dl.band === 'late') {
        var ext = rec && String(rec.extension_reason || '').trim();
        return '<div class="deadline red">More than 34 business days since open negotiation started (business day ' + dl.b + '). The initiation window was ' + win + '. ' +
          (ext ? 'Extension reason given: upload its evidence below.' : 'Pick an extension reason below, or this dispute cannot go to the US desk (Deadline passed).') + '</div>';
      }
      return '<div class="deadline' + (dl.daysLeft <= 1 ? ' red' : '') + '">Initiation window: ' + win + ' (' + dl.daysLeft + ' business day' +
        (dl.daysLeft === 1 ? '' : 's') + ' left). Open negotiation ended ' + esc(portalDate(dl.onEnds)) + '.</div>';
    }

    // ---------------------------------------------------------------- field rendering

    function optionList(f) {
      return Array.isArray(f.options) ? f.options : (S.boot.options[f.options] || []);
    }

    // QPA files belong to a saved line (lineNo) or to a new line not saved yet (lineKey).
    function filesFor(category, lineNo, lineKey) {
      return S.files.filter(function (x) {
        if (x.Category !== category) return false;
        if (category !== 'qpa') return true;
        return (lineNo && Number(x.LineNo) === Number(lineNo)) || (!!lineKey && x.LineKey === lineKey && String(x.LineNo) === '');
      });
    }

    // Uploads go to the saved dispute, or to the draft token of a new one (Staging folder until the first save).
    function uploadTarget() { return S.id || S.draftToken; }
    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var n = Math.random() * 16 | 0; return (c === 'x' ? n : (n & 3 | 8)).toString(16); });
    }

    // QPA files of other lines with this claim number: one EOB usually covers the whole claim.
    function sameClaimDocs(claim, lineNo) {
      claim = String(claim || '').trim();
      if (!claim) return [];
      var nums = S.lines.filter(function (l) { return Number(l.LineNo) !== Number(lineNo) && String(l.claim_number).trim() === claim; })
        .map(function (l) { return Number(l.LineNo); });
      var seen = {};
      return S.files.filter(function (x) {
        if (x.Category !== 'qpa' || nums.indexOf(Number(x.LineNo)) === -1 || seen[x.FileId]) return false;
        seen[x.FileId] = true;
        return true;
      });
    }

    function chip(f, v) {
      var d = defaultFor(f.key);
      if (!S.defaulted[f.key] || !d || String(v) !== String(resolveToken(d.value))) return '';
      var learned = d.source === 'learned';
      return '<span class="chip' + (learned ? ' learned' : '') + '" data-default title="' +
        esc(learned ? 'Used on ' + Math.round(d.share * 100) + '% of the last ' + d.sample + ' saves' : 'Starting default') + '">default</span>';
    }

    // The value an auto field takes: I'm a(n) from the billing entity, the insurance provider type from the plan type.
    function autoValue(f, rec) {
      if (f.auto === 'entity') {
        var e = entryFor('BillingEntity', rec.prov_name);
        var d = e && e.d;
        if (!d || !d.acting_as) return null;
        return { value: d.acting_as, confirmed: d.acting_as_confirmed === true || d.acting_as_confirmed === 'true', from: 'billing entity ' + e.v };
      }
      if (f.auto === 'planType') {
        var r = planRoleFor(rec.q_plan_type);
        return r ? { value: r, confirmed: true, from: 'Health Plan Type (page 1)' } : null;
      }
      return null;
    }

    function renderField(f, rec, lineNo, ctx) {
      ctx = ctx || ctxFor();
      var v = rec[f.key] == null ? '' : rec[f.key];
      var star = f.required || f.requiredUnless ? '<span class="req">*</span> ' : '';
      var width = f.width ? ' ' + f.width : '';
      var id = 'f_' + f.key;
      var label = star + esc(f.label) + chip(f, v);
      var hide = fieldShown(f, rec, ctx) ? '' : ' hidden';
      var h = '<div class="f' + width + hide + '" data-key="' + esc(f.key) + '">';
      if (f.type === 'radio' || f.type === 'checkboxes') {
        var picked = f.type === 'checkboxes' ? String(v).split(/;\s*/) : [String(v)];
        var auto = f.auto ? autoValue(f, rec) : null;
        var locked = auto && auto.confirmed && editable() && !S.unlocked[f.key] && (isEmpty(v) || String(v) === auto.value);
        if (locked && isEmpty(v)) { rec[f.key] = auto.value; v = auto.value; picked = [v]; if (rec === S.d) S.pending[f.key] = v; }
        if (auto && !auto.confirmed && String(v) === auto.value) label += '<span class="chip guess" title="First guess from the legal name: PLLC = provider, LLC = facility">guess from the name: check it</span>';
        h += '<div class="lbl">' + label + '</div>';
        if (locked) {
          h += '<div class="locked"><span class="lock">Locked</span><span data-locked-value>' + esc(v) + '</span><span class="muted" style="font-weight:400">from ' + esc(auto.from) +
            '</span><button class="link" data-unlock>Change</button></div>';
        }
        h += '<div class="choices' + (locked ? ' hidden' : '') + '">';
        optionList(f).forEach(function (o) {
          var oe = f.optionNotes ? entryFor(f.options, o) : null;
          var note = oe && oe.l ? '<span class="opt-note">' + esc(oe.l) + '</span>' : '';
          h += '<label><input type="' + (f.type === 'radio' ? 'radio' : 'checkbox') + '" name="' + esc(f.key) + '" value="' + esc(o) + '"' +
            (picked.indexOf(o) !== -1 ? ' checked' : '') + '> <span>' + esc(o) + note + '</span></label>';
        });
        h += '</div>';
        if (f.stop) h += '<div class="stop' + (keyOf(f.options, v) === f.stop.is ? '' : ' hidden') + '" data-stop>' + esc(f.stop.message) + '. This dispute cannot go to the US desk.</div>';
      } else if (f.type === 'check') {
        h += '<div class="choices"><label><input type="checkbox" name="' + esc(f.key) + '" value="Yes"' + (String(v) === 'Yes' ? ' checked' : '') + '> <span>' + star + esc(f.label) + '</span></label></div>';
      } else if (isFixed(f)) {
        h += '<div class="lbl">' + label + '</div><div class="locked"><span class="lock">Fixed</span>' + esc(f.default) + '</div>';
      } else if (f.type === 'select') {
        h += '<label for="' + id + '">' + label + '</label><select id="' + id + '" name="' + esc(f.key) + '"><option value="">Select an Option</option>';
        optionList(f).forEach(function (o) { h += '<option' + (o === String(v) ? ' selected' : '') + '>' + esc(o) + '</option>'; });
        h += '</select>';
      } else if (f.type === 'combo' && f.addNew) {
        // Searchable box: suggestions (and, for people, active members) with "Add new" when nothing matches.
        h += '<label for="' + id + '">' + label + '</label><div class="search-box"><input type="text" id="' + id + '" name="' + esc(f.key) + '" value="' + esc(v) +
          '" autocomplete="off" placeholder="' + esc(f.addNew === 'email' ? 'Search by name or email' : 'Search or add new') + '"><div class="dropdown hidden" data-dropdown></div></div>' +
          '<div class="hint" data-hint></div>';
      } else if (f.type === 'combo') {
        h += '<label for="' + id + '">' + label + '</label><input type="text" id="' + id + '" name="' + esc(f.key) + '" value="' + esc(v) + '" list="dl_' + esc(f.key) +
          '" autocomplete="off"' + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + '><datalist id="dl_' + esc(f.key) + '">' +
          entries(f.options).map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.l ? ' label="' + esc(o.v + ' · ' + o.l) + '"' : '') + '></option>'; }).join('') +
          '</datalist><div class="hint" data-hint></div>';
      } else if (f.type === 'textarea') {
        h += '<label for="' + id + '">' + label + '</label><textarea id="' + id + '" name="' + esc(f.key) + '">' + esc(v) + '</textarea>';
      } else if (f.type === 'file') {
        var list = filesFor(f.category, lineNo, rec.lineKey);
        h += '<div class="lbl">' + star + esc(f.label) + '</div><div class="upload">' +
          '<input type="file" multiple data-category="' + esc(f.category) + '" id="' + id + '"' + (editable() ? '' : ' disabled') + '>' +
          (f.category === 'qpa' ? '<label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="same-claim" checked> Use for all lines with this claim number</label>' : '') +
          '<div class="note">Files go to this dispute\'s Drive folder for the US desk to upload' + (S.id ? '' : ' (you can attach them before saving)') + '. Under ' + rules().maxFileMb + ' MB each; ' + rules().disputeMaxMb + ' MB for the whole dispute.</div>' +
          '<div class="file-list" data-files="' + esc(f.category) + '">' + fileRows(list) + '</div>' +
          (f.category === 'qpa' ? '<div class="note" data-claim-docs></div>' : '') + '</div>';
      } else {
        var type = f.type === 'date' ? 'date' : (f.type === 'email' ? 'email' : 'text');
        var extra = f.type === 'money' ? ' inputmode="decimal"' : (f.type === 'phone' || f.digits ? ' inputmode="tel"' : '');
        if (f.type === 'date' && f.min) extra += ' min="' + f.min + '"';
        if (f.type === 'date' && f.max === 'today') extra += ' max="' + today() + '"';
        h += '<label for="' + id + '">' + label + '</label><input type="' + type + '" id="' + id + '" name="' + esc(f.key) + '" value="' + esc(v) + '"' +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + extra + '>';
        if (f.helper === 'deadline') h += '<div data-deadline>' + deadlineText(v, rec) + '</div>';
      }
      if (f.note) h += '<div class="note">' + esc(f.note) + '</div>';
      return h + '<div class="msg"></div></div>';
    }

    function fileRows(list) {
      return list.map(function (x) {
        return '<div><a href="' + esc(x.Url) + '" target="_blank" rel="noopener">' + esc(x.Name) + '</a>' +
          (editable() ? '<button class="link" data-remove-file="' + esc(x.FileId) + '">Remove</button>' : '') + '</div>';
      }).join('') || '<span class="muted">No File Selected.</span>';
    }

    function readFields(container, fields) {
      var out = {};
      fields.forEach(function (f) {
        if (f.type === 'file') return;
        if (isFixed(f)) { out[f.key] = String(f.default); return; }
        var box = container.querySelector('.f[data-key="' + f.key + '"]');
        if (!box) return;
        if (f.type === 'radio') {
          var on = box.querySelector('input:checked');
          out[f.key] = on ? on.value : '';
        } else if (f.type === 'checkboxes') {
          out[f.key] = Array.prototype.map.call(box.querySelectorAll('input:checked'), function (i) { return i.value; }).join('; ');
        } else if (f.type === 'check') {
          out[f.key] = box.querySelector('input').checked ? 'Yes' : '';
        } else {
          var v = box.querySelector('input, select, textarea').value.trim();
          if (f.type === 'phone') v = normPhone(v);
          if (f.type === 'zip') v = normZip(v);
          if (f.digits) v = v.replace(/[\s-]/g, '');
          if (f.multi) v = normModifiers(v);
          if (f.upper) v = v.toUpperCase();
          out[f.key] = v;
        }
      });
      return out;
    }

    // Shows a field's message; a character problem gets a Fix button that strips what the portal rejects.
    function showMsg(box, f, msg) {
      box.classList.toggle('err', !!msg);
      var m = box.querySelector('.msg');
      m.textContent = msg;
      var el = box.querySelector('input, textarea');
      if (msg && f.chars && el && badChars(f.chars, el.value).length) {
        var b = document.createElement('button');
        b.className = 'link';
        b.textContent = 'Fix';
        // Keep the focus in the field, so its blur check does not redraw the message under the click.
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function (e) {
          e.preventDefault();
          el.value = fixChars(f.chars, el.value);
          showMsg(box, f, '');
          el.dispatchEvent(new Event('change', { bubbles: true }));
        });
        m.appendChild(b);
      }
    }

    function showErrors(container, fields, rec, ctx) {
      var bad = 0;
      fields.forEach(function (f) {
        var box = container.querySelector('.f[data-key="' + f.key + '"]');
        if (!box || f.type === 'file') return;
        var msg = check(f, rec[f.key], rec, ctx);
        showMsg(box, f, msg);
        if (msg) bad++;
      });
      if (bad) {
        var first = container.querySelector('.f.err');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return bad;
    }

    // A typed value that looks like a typo of a known one must be confirmed before it is saved as new.
    function pendingSuggestion(container) {
      var box = container.querySelector('.f[data-suggest]:not([data-kept]):not(.hidden)');
      if (!box) return false;
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      toast('Check the suggested spelling first: use it, or keep what you typed.', true);
      return true;
    }

    // Shows or hides the conditional fields (and the hard-stop and deadline notes) as answers change.
    function refreshForm(container, fields, base, ctx) {
      var rec = Object.assign({}, base, readFields(container, fields));
      fields.forEach(function (f) {
        var box = container.querySelector('.f[data-key="' + f.key + '"]');
        if (!box) return;
        if (f.showIf) box.classList.toggle('hidden', !fieldShown(f, rec, ctx || ctxFor()));
        if (f.helper === 'deadline') box.querySelector('[data-deadline]').innerHTML = deadlineText(rec[f.key], rec);
        if (f.stop) box.querySelector('[data-stop]').classList.toggle('hidden', keyOf(f.options, rec[f.key]) !== f.stop.is);
      });
      return rec;
    }

    // Wires a form: combos and the address book, defaults chips, formats, the portal character check,
    // conditional fields, locked chips, Enter to go to the next field.
    function wireForm(container, fields, rec, ctx) {
      fields.forEach(function (f) {
        var box = container.querySelector('.f[data-key="' + f.key + '"]');
        if (!box) return;
        var el = box.querySelector('input, select, textarea');
        box.addEventListener('change', function () { dropChip(box); });
        if (f.type === 'combo' && f.addNew) wireSearchBox(box, f);
        if (f.type === 'combo') {
          el.addEventListener('change', function () { comboChanged(container, box, f, rec); });
          if (f.fill && !isEmpty(rec[f.key])) showFillNote(container, box, f, rec, String(rec[f.key]), -1);
        }
        if (f.type === 'phone' || f.type === 'zip' || f.digits || f.multi || f.upper) {
          el.addEventListener('blur', function () {
            var v = el.value;
            if (f.type === 'phone') v = normPhone(v); else if (f.type === 'zip') v = normZip(v);
            if (f.digits) v = v.replace(/[\s-]/g, '');
            if (f.multi) v = normModifiers(v);
            if (f.upper) v = v.toUpperCase();
            el.value = v;
          });
        }
        // The portal checks names and addresses when the field loses focus; so does the Studio.
        if (f.chars) {
          el.addEventListener('blur', function () {
            var bad = badChars(f.chars, el.value);
            showMsg(box, f, bad.length ? 'Has characters the portal does not accept (' + bad.join(' ') + '). Allowed: ' + CHAR_HELP[f.chars] + '.' : '');
          });
          if (!isEmpty(rec[f.key]) && badChars(f.chars, rec[f.key]).length) showMsg(box, f, check(f, rec[f.key], rec, ctx));
        }
        var unlock = box.querySelector('[data-unlock]');
        if (unlock) unlock.addEventListener('click', function (e) {
          e.preventDefault();
          S.unlocked[f.key] = true;
          box.querySelector('.locked').classList.add('hidden');
          box.querySelector('.choices').classList.remove('hidden');
        });
      });
      var upd = function () { refreshForm(container, fields, rec, ctx); };
      container.addEventListener('change', upd);
      container.addEventListener('input', function (e) { if (e.target && e.target.type === 'date') upd(); });
      container.addEventListener('keydown', function (e) {
        var t = e.target;
        if (e.key !== 'Enter' || !t || t.tagName !== 'INPUT' || /^(file|button|submit)$/.test(t.type)) return;
        e.preventDefault();
        var all = Array.prototype.filter.call(container.querySelectorAll('input:not([type=file]):not([disabled]), select, textarea'), function (x) { return x.offsetParent !== null; });
        var i = all.indexOf(t);
        if (i !== -1 && all[i + 1]) all[i + 1].focus();
      });
    }

    // Matches for a searchable box: list values and (people boxes) active members, on value, email or name.
    function searchMatches(f, typed) {
      var q = String(typed || '').trim().toLowerCase();
      var out = [], seen = {};
      var add = function (value, text) {
        var k = optionKey(value);
        if (!k || seen[k]) return;
        if (q && String(value).toLowerCase().indexOf(q) === -1 && String(text).toLowerCase().indexOf(q) === -1) return;
        seen[k] = true;
        out.push({ value: value, text: text });
      };
      if (f.people) (S.boot.people || []).forEach(function (p) { add(p.email, p.name ? p.name + ' · ' + p.email : p.email); });
      entries(f.options).forEach(function (o) { add(o.v, o.l ? o.v + ' · ' + o.l : o.v); });
      return out.slice(0, 8);
    }

    function wireSearchBox(box, f) {
      var el = box.querySelector('input');
      var dd = box.querySelector('[data-dropdown]');
      var pick = function (v) { el.value = v; dd.classList.add('hidden'); el.dispatchEvent(new Event('change', { bubbles: true })); };
      var show = function () {
        var typed = el.value.trim();
        var list = searchMatches(f, typed);
        var exact = list.some(function (m) { return optionKey(m.value) === optionKey(typed); });
        var html = list.map(function (m, i) { return '<button type="button" class="dd-item" data-i="' + i + '">' + esc(m.text) + '</button>'; }).join('');
        if (typed && !exact) {
          var ok = f.addNew !== 'email' || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(typed);
          html += ok ? '<button type="button" class="dd-item dd-new" data-new>Add new: ' + esc(typed) + '</button>'
            : '<div class="dd-note">To add a new one, type a full email address.</div>';
        }
        dd.innerHTML = html || '<div class="dd-note">No match.</div>';
        dd.classList.remove('hidden');
        dd.querySelectorAll('.dd-item').forEach(function (b) {
          b.addEventListener('mousedown', function (e) { e.preventDefault(); });
          b.addEventListener('click', function (e) {
            e.preventDefault();
            if (b.hasAttribute('data-new')) { pick(f.addNew === 'email' ? typed.toLowerCase() : typed); toast('New value: it is added to the list when you save.'); }
            else pick(list[Number(b.getAttribute('data-i'))].value);
          });
        });
      };
      el.addEventListener('focus', show);
      el.addEventListener('input', show);
      el.addEventListener('blur', function () { setTimeout(function () { dd.classList.add('hidden'); }, 150); });
    }

    function comboChanged(container, box, f, rec) {
      var el = box.querySelector('input');
      var hint = box.querySelector('[data-hint]');
      var v = el.value.trim();
      box.removeAttribute('data-suggest');
      box.removeAttribute('data-kept');
      hint.className = 'hint';
      hint.innerHTML = '';
      if (!v) return;
      var s = f.multi || (f.people && knownValue(f, v)) ? '' : suggestFor(f, v);
      if (s) {
        box.setAttribute('data-suggest', s);
        hint.className = 'hint ask';
        hint.innerHTML = 'Did you mean <b>' + esc(s) + '</b>? <button class="link" data-use>Use it</button> · <button class="link" data-keep>Keep "' + esc(v) + '"</button>';
        hint.querySelector('[data-use]').addEventListener('click', function (e) {
          e.preventDefault();
          el.value = s;
          comboChanged(container, box, f, rec);
        });
        hint.querySelector('[data-keep]').addEventListener('click', function (e) {
          e.preventDefault();
          box.setAttribute('data-kept', '1');
          hint.className = 'hint';
          hint.textContent = 'New value: it is added to the list when you save.';
        });
        return;
      }
      if (f.fill && entryFor(f.options, v)) {
        showFillNote(container, box, f, rec, v, fillForm(container, f, v, rec, false, box.getAttribute('data-prev') || rec[f.key]));
        box.setAttribute('data-prev', v);
        if (f.options === 'BillingEntity') syncEntityAuto(container, v);
        if (f.chars && badChars(f.chars, v).length) showMsg(box, f, check(f, v, rec));
        return;
      }
      var known = f.multi ? splitMulti(v).every(function (x) { return entryFor(f.options, x); }) : (!!entryFor(f.options, v) || (f.people && knownValue(f, v)));
      if (!known) hint.textContent = 'New value: it is added to the list when you save.';
    }

    // I am a(n) always follows the billing entity picked: locked when a saved dispute confirmed it, a guess to check otherwise.
    function syncEntityAuto(container, entity) {
      var box = container.querySelector('.f[data-key="q_acting_as"]');
      if (!box || S.unlocked.q_acting_as) return;
      var auto = autoValue({ auto: 'entity' }, { prov_name: entity });
      if (!auto) return;
      var radio = box.querySelector('input[value="' + auto.value + '"]');
      if (radio) radio.checked = true;
      if (S.d) { S.d.q_acting_as = auto.value; S.pending.q_acting_as = auto.value; }
      var lock = box.querySelector('.locked'), choices = box.querySelector('.choices'), lbl = box.querySelector('.lbl');
      var old = lbl.querySelector('.chip.guess');
      if (old) old.parentNode.removeChild(old);
      if (auto.confirmed && lock) {
        lock.querySelector('[data-locked-value]').textContent = auto.value;
        lock.querySelector('.muted').textContent = 'from ' + auto.from;
        lock.classList.remove('hidden');
        choices.classList.add('hidden');
      } else {
        if (lock) lock.classList.add('hidden');
        choices.classList.remove('hidden');
        if (!auto.confirmed) lbl.insertAdjacentHTML('beforeend', '<span class="chip guess" title="First guess from the legal name: PLLC = provider, LLC = facility">guess from the name: check it</span>');
      }
      box.classList.remove('err');
      box.querySelector('.msg').textContent = '';
    }

    // n: fields just filled (-1 when only offering a refill).
    function showFillNote(container, box, f, rec, value, n) {
      var e = entryFor(f.options, value);
      var hint = box.querySelector('[data-hint]');
      if (!e || !e.d) return;
      hint.className = 'hint';
      hint.innerHTML = (n > 0 ? 'Filled from the address book (' + n + ' field' + (n === 1 ? '' : 's') + '). ' : n === 0 ? 'In the address book. ' : '') +
        '<button class="link" data-refill>Refill from ' + esc(e.v) + '</button>';
      hint.querySelector('[data-refill]').addEventListener('click', function (ev) {
        ev.preventDefault();
        var m = fillForm(container, f, e.v, rec, true);
        hint.innerHTML = 'Filled from the address book (' + m + ' field' + (m === 1 ? '' : 's') + ').';
      });
    }

    function pageFields(page) {
      var all = [];
      page.sections.forEach(function (s) { all = all.concat(s.fields); });
      return all;
    }

    // Same rule as assertCanEdit_: LB Members edit Draft and Returned disputes, Admins every dispute not filed, US Members none.
    function editable() {
      if (!S.boot.isLb || S.d.Status === 'Filed') return false;
      return S.boot.isAdmin || !S.d.Status || S.d.Status === 'Draft' || S.d.Status === 'Returned';
    }

    // ---------------------------------------------------------------- completeness per page (the stepper)

    function pageAt(i) {
      var sc = S.boot.schema;
      return i <= 3 ? sc.pages[i] : i === 4 ? sc.line : i === 5 ? sc.final : sc.review;
    }

    function headerIssues(page) {
      var ctx = ctxFor(S.d), out = [];
      pageFields(page).forEach(function (f) {
        if (f.type === 'file') {
          if (fieldRequired(f, S.d, ctx) && !filesFor(f.category).length) out.push(f.label + ': missing');
          return;
        }
        var m = check(f, S.d[f.key], S.d, ctx);
        if (m) out.push(f.label + ' ' + m);
        if (f.stop && keyOf(f.options, S.d[f.key]) === f.stop.is) out.push(f.stop.message);
      });
      if (page.id === 'qual') { var t = timingProblem(S.d); if (t) out.push(t); }
      return out;
    }

    function lineIssues(l) {
      var ctx = ctxFor(S.d), out = [];
      pageFields(S.boot.schema.line).forEach(function (f) {
        if (f.type === 'file') {
          if (fieldRequired(f, l, ctx) && !filesFor('qpa', l.LineNo).length) out.push('QPA documentation is missing');
          return;
        }
        var m = check(f, l[f.key], l, ctx);
        if (m) out.push(f.label + ' ' + m);
      });
      return out;
    }

    function linesIssues() {
      var out = lineRules(S.d, S.lines).concat(repeatsWithin(S.lines));
      S.lines.forEach(function (l) { lineIssues(l).forEach(function (m) { out.push('Line ' + l.LineNo + ': ' + m); }); });
      return out;
    }

    function pageIssues(i) {
      if (i <= 3 || i === 5) return headerIssues(pageAt(i));
      if (i === 4) return linesIssues();
      var all = [];
      for (var k = 0; k < 6; k++) all = all.concat(pageIssues(k));
      return all;
    }

    // Moving forward is allowed only when every page before the target is complete and no line item is left unsaved.
    // Returns null when the move is allowed, else { page, message }. Back and read-only disputes are never blocked.
    function forwardBlock(target) {
      if (target <= S.page || !editable()) return null;
      if (S.page === 4 && (S.line !== null || S.paste !== null)) {
        return { page: 4, message: S.line !== null ? 'Save the open line item (Save line item) or Cancel it before you continue.' :
          'Add the pasted lines or cancel the paste before you continue.' };
      }
      for (var k = 0; k < target; k++) {
        var list = pageIssues(k);
        if (list.length) return { page: k, message: 'Page ' + (k + 1) + ' has ' + list.length + ' issue(s) to fix: ' + list[0] };
      }
      return null;
    }

    // Shows why a forward move was refused and opens the page that needs fixing.
    function refuseForward(block) {
      S.blocked = block.page === 4 ? (S.line !== null || S.paste !== null ? [block.message] : linesIssues()) : null;
      if (block.page !== S.page) { S.page = block.page; S.line = null; S.paste = null; }
      render();
      toast(block.message, true);
    }

    // ---------------------------------------------------------------- file uploads

    function readAsBase64(file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
        r.onerror = function () { reject(new Error('Could not read ' + file.name)); };
        r.readAsDataURL(file);
      });
    }

    // Bytes already in the dispute that go to the portal (a file shared by several lines counts once).
    function disputeBytes() {
      var seen = {}, cats = rules().portalFileCategories;
      return S.files.reduce(function (sum, f) {
        if (cats.indexOf(f.Category) === -1 || seen[f.FileId]) return sum;
        seen[f.FileId] = true;
        return sum + (Number(f.Size) || 0);
      }, 0);
    }

    // Files go up in parallel; each reply carries the dispute's file list, merged here.
    function uploadAll(files, category, ln, sameClaim) {
      var big = files.filter(function (f) { return f.size > rules().fileLimit; })[0];
      if (big) return Promise.reject(new Error(big.name + ' is over ' + rules().maxFileMb + ' MB.'));
      var total = files.reduce(function (s, f) { return s + f.size; }, 0);
      if (rules().portalFileCategories.indexOf(category) !== -1 && disputeBytes() + total > rules().disputeFileLimit) return Promise.reject(new Error(rules().msg.fileLimit));
      return Promise.all(files.map(function (file) {
        return readAsBase64(file).then(function (b64) {
          return call('uploadFile', uploadTarget(), category, ln.lineNo || '', file.name, file.type, b64, !!sameClaim, ln.lineKey || '');
        });
      })).then(function (replies) {
        // The last reply has every row (all uploads finished); rows from the others are merged in case of overlap.
        var seen = {};
        S.files = replies.reduce(function (all, r) { return all.concat(r.files); }, []).reverse().filter(function (f) {
          var k = f.FileId + '|' + f.LineNo + '|' + f.Category;
          if (seen[k]) return false;
          seen[k] = true;
          return true;
        }).reverse();
      });
    }

    // After an upload or removal only the file lists change, so anything typed but not yet saved stays put.
    // line() gives { lineNo, lineKey } of the open line form ({} on the dispute pages).
    function updateFileLists(container, line) {
      var ln = line();
      container.querySelectorAll('[data-files]').forEach(function (box) {
        box.innerHTML = fileRows(filesFor(box.getAttribute('data-files'), ln.lineNo, ln.lineKey));
      });
      wireRemoves(container, line);
      if (container.updateClaimDocs) container.updateClaimDocs();
    }

    function wireRemoves(container, line) {
      container.querySelectorAll('[data-remove-file]').forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.preventDefault();
          var ln = line();
          busy(true);
          call('removeFile', uploadTarget(), b.getAttribute('data-remove-file'), ln.lineNo || '', ln.lineKey || '')
            .then(function (files) { S.files = files; busy(false); updateFileLists(container, line); }).catch(fail);
        });
      });
    }

    // Files can be attached before the dispute or the line is saved; the server links them on the first save.
    function wireUploads(container, line) {
      container.querySelectorAll('input[type=file][data-category]').forEach(function (input) {
        input.addEventListener('change', function () {
          if (!input.files.length) return;
          var files = Array.prototype.slice.call(input.files);
          var cat = input.getAttribute('data-category');
          var same = container.querySelector('#same-claim');
          busy(true);
          uploadAll(files, cat, line(), cat === 'qpa' && same && same.checked)
            .then(function () { busy(false); input.value = ''; updateFileLists(container, line); toast('Uploaded'); })
            .catch(fail);
        });
      });
      wireRemoves(container, line);
    }

    // ---------------------------------------------------------------- data loading

    // Every server action that changes a dispute replies with the updated dispute, so no second call is needed.
    function apply(bundle) {
      S.d = bundle.dispute; S.lines = bundle.lines; S.files = bundle.files;
      S.warnings = bundle.warnings || []; S.deadline = bundle.deadline || null;
      S.lists = {}; // list counts and dates changed
    }

    function refresh() {
      if (!S.id) return Promise.resolve();
      return call('getDispute', S.id).then(apply);
    }

    function open(id, view) {
      S.id = id; S.copied = {}; S.deskLine = 0; S.line = null; S.defaulted = {}; S.pending = {}; S.unlocked = {}; S.paste = null;
      busy(true);
      refresh().then(function () {
        busy(false);
        if (view) S.view = view;
        else if (S.boot.role === 'US Member' || (S.d.Status === 'Ready for US desk' && S.boot.isUsDesk)) S.view = 'desk';
        else { S.view = 'edit'; S.page = S.lines.length ? 6 : 0; }
        render();
      }).catch(fail);
    }

    function warnBox(list, title) {
      if (!list || !list.length) return '';
      return '<div class="warn"><b>' + esc(title || 'Check before sending (these do not block):') + '</b><ul>' +
        list.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';
    }

    function problemBox(list, title) {
      if (!list || !list.length) return '';
      return '<div class="problems"><b>' + esc(title) + '</b><ul>' + list.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>';
    }

    // ---------------------------------------------------------------- views

    function render() {
      window.scrollTo(0, 0);
      S.save = null;
      if (S.view !== 'desk') stopTimer();
      if (S.view === 'list') return renderList();
      if (S.view === 'desk') return renderDesk();
      if (S.view === 'insights') return renderInsights();
      if (S.view === 'admin') return renderAdmin();
      return renderEditor();
    }

    // Ctrl+S (Cmd+S) saves the open page or line.
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        if (S.save) S.save(); else toast('Nothing to save on this screen.');
      }
    });

    function dueCell(r) {
      if (!r.initiateBy) return '';
      if (r.band === 'early') return '<span><b>Not open yet</b></span><div class="muted">opens ' + esc(portalDate(r.opens)) + ', window to ' + esc(portalDate(r.initiateBy)) + '</div>';
      if (r.band === 'late') return '<span class="days-red">Window passed</span><div class="muted">' + (r.extension ? 'extension reason given' : 'needs an extension reason') + '</div>';
      return '<span class="' + (r.daysLeft <= 1 ? 'days-red' : '') + '">' + esc(portalDate(r.initiateBy)) + '</span><div class="muted">' +
        esc(r.daysLeft + ' business day' + (r.daysLeft === 1 ? '' : 's') + ' left') + '</div>';
    }

    function renderList() {
      var filters = S.boot.role === 'US Member' ? ['Ready for US desk', 'Filed', 'All'] : ['Draft', 'Returned', 'Ready for US desk', 'Filed', 'All'];
      app.innerHTML = '<div class="list-head"><div><h1>Disputes</h1><p class="sub">Prepare each Notice of IDR Initiation here, on 7 pages in the portal\'s order.</p></div>' +
        '<div class="right" style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" id="insights">Insights</button>' +
        (S.boot.isAdmin ? '<button class="ghost" id="admin">Admin</button>' : '') +
        (S.boot.isLb ? '<button class="primary" id="new">+ New dispute</button>' : '') + '</div></div>' +
        '<div class="filters">' + filters.map(function (f) { return '<button data-f="' + esc(f) + '"' + (S.filter === f ? ' class="on"' : '') + '>' + esc(f) + '</button>'; }).join('') + '</div>' +
        '<div id="rows" style="margin-top:12px"><p class="muted">Loading…</p></div>';
      if (app.querySelector('#new')) app.querySelector('#new').addEventListener('click', function () {
        S.id = null; S.draftToken = 'DRAFT-' + uuid(); S.d = { Status: 'Draft' }; S.lines = []; S.files = []; S.warnings = []; S.deadline = null;
        S.page = 0; S.view = 'edit'; S.defaulted = {}; S.pending = {}; S.unlocked = {}; S.line = null; S.paste = null; render();
      });
      app.querySelector('#insights').addEventListener('click', function () { S.view = 'insights'; render(); });
      if (app.querySelector('#admin')) app.querySelector('#admin').addEventListener('click', function () { S.view = 'admin'; render(); });
      app.querySelectorAll('[data-f]').forEach(function (b) {
        b.addEventListener('click', function () { S.filter = b.getAttribute('data-f'); renderList(); });
      });
      // A list seen before shows at once; it is then refreshed in the background unless it is only seconds old.
      var filter = S.filter, cached = S.lists[filter];
      if (cached) showRows(cached.rows);
      if (cached && Date.now() - cached.at < 5000) return;
      call('listDisputes', filter).then(function (rows) {
        S.lists[filter] = { rows: rows, at: Date.now() };
        if (S.view === 'list' && S.filter === filter) showRows(rows);
      }).catch(fail);
    }

    // On the US desk queue, disputes whose filing window has not opened yet are listed apart (not workable yet).
    function showRows(rows) {
      var box = app.querySelector('#rows');
      if (!box) return;
      if (!rows.length) { box.innerHTML = '<p class="muted">Nothing here.</p>'; return; }
      if (S.boot.isUsDesk && S.filter === 'Ready for US desk') {
        var openNow = rows.filter(function (r) { return r.band !== 'early'; });
        var later = rows.filter(function (r) { return r.band === 'early'; }).sort(function (a, b) { return a.opens < b.opens ? -1 : 1; });
        box.innerHTML = (openNow.length ? rowsTable(openNow) : '<p class="muted">Nothing to file now.</p>') +
          (later.length ? '<h3 style="margin-top:22px">Not open yet <span class="muted" style="font-weight:400">(filing window opens on the date shown; Start portal entry and Mark as filed wait until then)</span></h3>' + rowsTable(later) : '');
      } else {
        box.innerHTML = rowsTable(rows);
      }
      box.querySelectorAll('tr[data-id]').forEach(function (tr) {
        tr.addEventListener('click', function () { open(tr.getAttribute('data-id')); });
      });
    }

    function rowsTable(rows) {
      return '<div style="overflow-x:auto"><table class="grid"><tr><th>Dispute</th><th>Status</th><th>Plan or company</th><th>Type</th><th>Line items</th><th>Initiation</th><th>Team / RCM Specialist</th><th>Last update</th></tr>' +
        rows.map(function (r) {
          return '<tr class="click" data-id="' + esc(r.id) + '"><td><b>' + esc(r.id) + '</b>' + (r.portalNumber ? '<div class="muted">' + esc(r.portalNumber) + '</div>' : '') + '</td><td>' + badge(r.status) +
            (r.idreStatus ? '<div class="muted" style="margin-top:4px">IDRE: ' + esc(r.idreStatus) + '</div>' : '') +
            (r.returnReason ? '<div class="muted" style="margin-top:4px">' + esc(r.returnReason) + '</div>' : '') + '</td><td>' + esc(r.plan) +
            '</td><td>' + esc(r.kind) + '</td><td>' + esc(r.lines) + '</td><td>' + dueCell(r) + '</td><td>' + esc([r.team, r.rcm].filter(String).join(' / ')) +
            '</td><td>' + esc(r.updatedAt) + '<div class="muted">' + esc(r.updatedBy) + '</div></td></tr>';
        }).join('') + '</table></div>';
    }

    // ---------------------------------------------------------------- editor (offshore entry)

    function stepper() {
      return '<div class="steps">' + PAGES.map(function (p, i) {
        var page = pageAt(i);
        var st = '';
        if (S.id) {
          var n = pageIssues(i).length;
          st = n ? '<span class="st bad">' + n + ' to fix</span>' : '<span class="st ok">✓</span>';
        }
        var locked = S.id && i > S.page && editable() && forwardBlock(i);
        return '<button data-step="' + i + '" class="' + (i === S.page ? 'on' : (i < S.page ? 'done' : '')) + (locked ? ' locked' : '') + '"' +
          (!S.id && i > 0 ? ' disabled' : '') + (locked ? ' title="Finish the earlier pages first"' : '') + '>' +
          (i + 1) + ' · ' + esc(page.short) + st + '</button>';
      }).join('') + '</div>';
    }

    function editorShell(inner, mirror, title) {
      return '<div class="list-head"><div><button class="link" id="exit">← All disputes</button><h1>' + esc(S.id || 'New dispute') + ' ' + badge(S.d.Status || 'Draft') + '</h1></div>' +
        (S.d.ConfirmationPdfUrl ? '<a class="btn ghost" target="_blank" rel="noopener" href="' + esc(S.d.ConfirmationPdfUrl) + '">Confirmation PDF</a>' : '') + '</div>' +
        (S.d.Status === 'Returned' && S.d.ReturnReason ? '<div class="problems"><b>Returned by the US desk:</b> ' + esc(S.d.ReturnReason) + '</div><br>' : '') +
        stepper() + '<div class="card"><div class="mirror">Mirrors portal page: ' + esc(mirror) + '</div><h2>' + esc(title) + '</h2>' +
        '<p class="req-note"><span class="req">*</span> Indicates a required field</p>' + inner + '</div>';
    }

    function footer(opts) {
      return '<div class="actions sticky"><div class="right"><button class="ghost" id="exit2">Exit</button>' +
        (opts.back ? '<button class="secondary" id="back">Back</button>' : '') + '<span class="keys">Enter: next field · Ctrl+S: save</span></div><div class="right">' +
        (opts.extra || '') + (opts.save ? '<button class="secondary" id="save-page">Save</button>' : '') +
        (opts.next ? '<button class="primary" id="cont">' + esc(opts.next) + '</button>' : '') + '</div></div>';
    }

    function wireShell() {
      app.querySelector('#exit').addEventListener('click', function () { S.view = 'list'; render(); });
      var exit2 = app.querySelector('#exit2');
      if (exit2) exit2.addEventListener('click', function () { S.view = 'list'; render(); });
      app.querySelectorAll('[data-step]').forEach(function (b) {
        b.addEventListener('click', function () {
          var target = Number(b.getAttribute('data-step'));
          var block = forwardBlock(target);
          if (block) { refuseForward(block); return; }
          S.page = target; S.line = null; S.paste = null; S.blocked = null; render();
        });
      });
      var back = app.querySelector('#back');
      if (back) back.addEventListener('click', function () { S.page--; S.line = null; S.paste = null; S.blocked = null; render(); });
    }

    function renderEditor() {
      if (S.page <= 3 || S.page === 5) return renderHeaderPage(pageAt(S.page));
      if (S.page === 4) return renderLines();
      return renderReview();
    }

    // The billing entity picker on page 1 fills Tax ID, NPI and I am a(n) right away; it is the same field as the provider name on page 3.
    function entityPicker() {
      var f = null;
      S.boot.schema.pages[2].sections.forEach(function (s) { s.fields.forEach(function (x) { if (x.key === 'prov_name') f = x; }); });
      return f ? Object.assign({}, f, { label: 'Billing entity (fills I am a(n), Tax ID, NPI and the initiating party details)', width: '', required: false }) : null;
    }

    function renderHeaderPage(page) {
      var inner = '';
      var fields = pageFields(page);
      var internal = [];
      if (page.id === 'qual') {
        internal = S.boot.schema.internal.slice();
        var picker = entityPicker();
        if (picker) internal.push(picker);
        fields = internal.concat(fields);
      }
      // The insurance provider type follows the plan type until someone changes it.
      if (page.id === 'noninit' && isEmpty(S.d.plan_role) && planRoleFor(S.d.q_plan_type)) { S.d.plan_role = planRoleFor(S.d.q_plan_type); S.pending.plan_role = S.d.plan_role; }
      applyDefaults(fields, S.d);
      var ctx = ctxFor(S.d);
      if (page.id === 'qual') {
        inner += '<div class="internal-box"><div class="lbl">Internal (not on the portal)</div><div class="fields">' +
          internal.map(function (f) { return renderField(f, S.d, '', ctx); }).join('') + '</div></div>';
      }
      page.sections.forEach(function (sec) {
        var body = '<div class="fields">' + sec.fields.map(function (f) { return renderField(f, S.d, '', ctx); }).join('') + '</div>';
        if (sec.collapsible) {
          var has = sec.fields.some(function (f) { return !isEmpty(S.d[f.key]); });
          inner += '<div class="poc' + (has ? '' : ' collapsed') + '"><h3>' + esc(sec.title) + ' <button class="link poc-toggle">+ Add point of contact</button></h3>' +
            '<p class="poc-hint">Once a contact name is entered, the full contact is required, including the mailing address.</p>' + body + '</div>';
        } else {
          if (sec.title) inner += '<h3>' + esc(sec.title) + '</h3>';
          inner += body;
        }
      });
      if (page.id === 'final') {
        inner += '<h3>Filled by the portal</h3><div class="fields">' + page.auto.map(function (a) {
          var v = a.from ? (S.d[a.from] || '(the provider name from page 3)') : a.text;
          return '<div class="f half"><div class="lbl"><span class="req">*</span> ' + esc(a.label) + '</div><div class="locked"><span class="lock">Auto</span>' + esc(v) + '</div></div>';
        }).join('') + '</div>';
      }
      if (page.id === 'dtype' && S.lines.length) inner += '<div class="warn">If you change the dispute type, the portal asks you to enter the line items again. Check page 5 after saving.</div>';
      inner += footer({ back: S.page > 0, save: editable(), next: editable() ? 'Save & Continue' : 'Continue' });
      app.innerHTML = editorShell(inner, page.step, page.title);
      wireShell();

      var card = app.querySelector('.card');
      wireForm(card, fields, S.d, ctx);
      card.querySelectorAll('.poc-toggle').forEach(function (b) {
        b.addEventListener('click', function (e) { e.preventDefault(); b.closest('.poc').classList.remove('collapsed'); });
      });
      wireUploads(card, function () { return {}; });

      var save = function (next) {
        if (!editable()) { if (next) { S.page++; render(); } return; }
        var values = Object.assign({}, S.pending, readFields(card, fields));
        var rec = Object.assign({}, S.d, values);
        var bad = showErrors(card, fields, rec, ctxFor(rec));
        if (bad && next) { toast('Fix the highlighted fields to continue, or Save to keep your work.', true); return; }
        if (pendingSuggestion(card)) return;
        var missingFile = fields.some(function (f) { return f.type === 'file' && fieldRequired(f, rec, ctxFor(rec)) && !filesFor(f.category).length; });
        busy(true);
        call('saveDispute', { id: S.id, values: values, page: page.id, draftToken: S.id ? '' : S.draftToken }).then(function (r) {
          S.id = r.id;
          S.draftToken = null;
          S.pending = {};
          learnLocal(fields, values);
          apply(r.bundle);
          busy(false);
          if (next && missingFile) { toast('Saved. Upload the required document before continuing.', true); render(); return; }
          if (next) S.page++;
          render();
          toast('Saved');
        }).catch(fail);
      };
      S.save = function () { save(false); };
      if (app.querySelector('#save-page')) app.querySelector('#save-page').addEventListener('click', function () { save(false); });
      app.querySelector('#cont').addEventListener('click', function () { save(true); });
    }

    function lineSchemaFields() { return pageFields(S.boot.schema.line); }

    // A new line starts with the claim number, date, item type and place of service of the previous line, then the defaults.
    function newLine(from) {
      var prev = from || S.lines[S.lines.length - 1];
      var rec = {};
      var fields = lineSchemaFields();
      if (prev) fields.forEach(function (f) { if (f.carry && !isEmpty(prev[f.key])) rec[f.key] = prev[f.key]; });
      fields.forEach(function (f) { delete S.defaulted[f.key]; });
      applyDefaults(fields, rec);
      rec.lineKey = uuid(); // files picked before the line is saved are kept under this key
      return rec;
    }

    function duplicateOf(src) {
      var rec = { lineKey: uuid() };
      lineSchemaFields().forEach(function (f) { if (f.type !== 'file' && !isEmpty(src[f.key])) rec[f.key] = src[f.key]; });
      return rec;
    }

    // Line 1 of a bundled dispute is the bundled item, later lines are components; a single dispute has one line.
    function canAddLine() {
      if (!editable() || S.lines.length >= rules().maxLines) return false;
      return !(S.d.dispute_kind === kinds().single && S.lines.length >= 1);
    }

    function kindNote() {
      var k = kinds(), kind = S.d.dispute_kind;
      if (kind === k.single) return 'Exactly one line item. The portal has no Add Line Item button.';
      if (kind === k.bundled) return 'Line 1 is the bundled item or service (the service code under dispute). Further lines are optional component items or services.';
      if (kind === k.batched) return 'At least 2 line items' + (String(S.d.on_start_date) >= rules().batchCapFrom ? ', at most 50' : '') +
        '. All dates of service within 30 business days of each other' + (coolingApplies(S.d) ? ' (not required here: cooling off period applies)' : '') + '.';
      return 'Pick the dispute type on page 2 first.';
    }

    function linesGrid() {
      var cols = S.boot.schema.final.columns.filter(function (c) { return !c.kinds || c.kinds.indexOf(S.d.dispute_kind) !== -1; });
      if (!S.lines.length) return '<p class="muted">No line items yet.</p>';
      return '<div style="overflow-x:auto"><table class="grid compact"><tr><th>#</th>' + cols.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') +
        '<th>Cost sharing</th><th>Initial payment</th><th>Check</th><th></th></tr>' +
        S.lines.map(function (l) {
          var n = lineIssues(l).length;
          return '<tr' + (S.line && Number(S.line.LineNo) === Number(l.LineNo) ? ' style="background:var(--cyan-tint)"' : '') + '><td>' + esc(l.LineNo) + '</td>' + cols.map(function (c) {
            var v = l[c.key];
            return '<td>' + esc(c.type === 'date' ? usDate(v) : c.type === 'money' ? moneyShown(v) : v) + '</td>';
          }).join('') + '<td>' + esc(moneyShown(l.cost_sharing)) + '</td><td>' + esc(moneyShown(l.initial_payment)) + '</td><td class="issues">' +
            (n ? '<span class="bad-count" title="' + esc(lineIssues(l).join('\n')) + '">' + n + ' to fix</span>' : '<span class="ok-tick">✓</span>') + '</td><td><div class="row-actions">' +
            '<button class="link" data-edit-line="' + esc(l.LineNo) + '">' + (editable() ? 'Edit' : 'View') + '</button>' +
            (canAddLine() ? '<button class="link" data-dup-line="' + esc(l.LineNo) + '">Duplicate</button>' : '') +
            (editable() ? '<button class="link" data-del-line="' + esc(l.LineNo) + '">Delete</button>' : '') + '</div></td></tr>';
        }).join('') + '</table></div>';
    }

    function renderLines() {
      var sc = S.boot.schema.line;
      var inner = '<div class="kind-note"><b>' + esc(S.d.dispute_kind || 'Dispute type not set') + '.</b> ' + esc(kindNote()) + '</div>';
      inner += '<h3>Summary of Qualified Items and/or Services</h3>' + linesGrid();
      var rulesNow = lineRules(S.d, S.lines).concat(repeatsWithin(S.lines));
      // Once the line form is closed, the list of things to fix stays live until it is empty.
      if (S.blocked && S.line === null && S.paste === null) S.blocked = linesIssues().length ? linesIssues() : null;
      if (S.blocked && S.blocked.length) inner += problemBox(S.blocked, 'Fix these before you continue:');
      else if (S.lines.length) inner += problemBox(rulesNow, 'Line item rules to fix:');
      inner += warnBox(S.warnings);
      if (S.line === null && S.paste === null) {
        inner += '<p class="row-actions" style="margin-top:14px">' + (canAddLine() ? '<button class="secondary" id="add">+ Add line item</button>' +
          (S.d.dispute_kind !== kinds().single ? '<button class="ghost" id="paste">Paste lines from a spreadsheet</button>' : '') : '') + '</p>';
        if (S.lines.length >= rules().maxLines) inner += '<div class="warn">' + esc(rules().msg.batchMax) + '</div>';
      }
      if (S.paste !== null) inner += pastePanel();
      if (S.line !== null) inner += lineForm();
      inner += footer({ back: true, next: 'Continue' });
      app.innerHTML = editorShell(inner, sc.step, sc.title);
      wireShell();
      var card = app.querySelector('.card');
      var byNo = function (b, attr) {
        var n = Number(b.getAttribute(attr));
        return S.lines.filter(function (l) { return Number(l.LineNo) === n; })[0];
      };
      card.querySelectorAll('[data-edit-line]').forEach(function (b) {
        b.addEventListener('click', function () { S.line = Object.assign({}, byNo(b, 'data-edit-line')); S.paste = null; render(); scrollToForm(); });
      });
      card.querySelectorAll('[data-dup-line]').forEach(function (b) {
        b.addEventListener('click', function () { S.line = duplicateOf(byNo(b, 'data-dup-line')); S.paste = null; render(); scrollToForm(); toast('Copy of line ' + b.getAttribute('data-dup-line') + ': change what differs, then save.'); });
      });
      card.querySelectorAll('[data-del-line]').forEach(function (b) {
        b.addEventListener('click', function () {
          var n = b.getAttribute('data-del-line');
          if (!confirm('Delete line ' + n + '?')) return;
          busy(true);
          call('deleteLine', S.id, n).then(function (bundle) { apply(bundle); busy(false); S.line = null; render(); }).catch(fail);
        });
      });
      if (card.querySelector('#add')) card.querySelector('#add').addEventListener('click', function () { S.line = newLine(); render(); scrollToForm(); });
      if (card.querySelector('#paste')) card.querySelector('#paste').addEventListener('click', function () { S.paste = { text: '', rows: null }; render(); scrollToForm(); });
      app.querySelector('#cont').addEventListener('click', function () {
        var block = forwardBlock(5);
        if (block) { refuseForward(block); return; }
        S.page = 5; S.line = null; S.paste = null; S.blocked = null; render();
      });
      if (S.paste !== null) wirePaste(card);
      if (S.line !== null) wireLineForm(card);
    }

    function scrollToForm() {
      var f = app.querySelector('.line-form');
      if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function lineForm() {
      var rec = S.line, sc = S.boot.schema.line, lineNo = rec.LineNo || '';
      var index = lineNo ? S.lines.map(function (l) { return Number(l.LineNo); }).indexOf(Number(lineNo)) : S.lines.length;
      var lt = lineTypeFor(S.d.dispute_kind, index);
      var ctx = ctxFor(S.d);
      var h = '<div class="line-form" data-line-form><div class="mirror" style="color:var(--text-2)">' + (lineNo ? 'Editing line ' + esc(lineNo) : 'New line ' + (S.lines.length + 1)) + '</div>';
      if (lt) h += '<div class="f"><div class="lbl"><span class="req">*</span> Item or Service Type:</div><div class="locked"><span class="lock">Set by the portal</span>' + esc(lt) + '</div></div>';
      sc.sections.forEach(function (sec) {
        h += '<h3>' + esc(sec.title) + '</h3><div class="fields">' + sec.fields.map(function (f) { return renderField(f, rec, lineNo, ctx); }).join('') + '</div>';
        if (sec.fields.some(function (f) { return f.key === 'initial_payment'; })) h += '<div class="warn hidden" id="amount-warn"></div>';
      });
      h += '<div class="actions"><div class="right"><button class="ghost" id="cancel">Cancel line</button>' +
        (lineNo && editable() ? '<button class="danger" id="del">Delete line</button>' : '') +
        (canAddLine() ? '<button class="secondary" id="dup">Duplicate line</button>' : '') + '</div><div class="right">' +
        (editable() ? '<button class="secondary" id="save">Save Item</button>' + (S.d.dispute_kind !== kinds().single && S.lines.length + (lineNo ? 0 : 1) < rules().maxLines ? '<button class="primary" id="saveadd">Save & Add Another</button>' : '') : '') +
        '</div></div></div>';
      return h;
    }

    function wireLineForm(card) {
      var form = card.querySelector('[data-line-form]');
      var fields = lineSchemaFields();
      var rec = S.line;
      var lineNo = rec.LineNo || '';
      var ctx = ctxFor(S.d);
      wireForm(form, fields, rec, ctx);
      wireAmounts(form);

      // "Uses line N's documentation" when another line has the same claim number.
      var claimInput = form.querySelector('.f[data-key="claim_number"] input');
      form.updateClaimDocs = function () {
        var box = form.querySelector('[data-claim-docs]');
        if (!box) return;
        var shared = filesFor('qpa', S.line && S.line.LineNo, S.line && S.line.lineKey).length ? [] : sameClaimDocs(claimInput.value, S.line && S.line.LineNo);
        box.textContent = shared.length ? 'Uses the QPA documentation already uploaded for this claim number: ' +
          shared.map(function (x) { return x.Name; }).join(', ') + '. It is linked to this line when you save.' : '';
      };
      claimInput.addEventListener('input', form.updateClaimDocs);
      form.updateClaimDocs();

      // Files picked on a new line are kept under its line key and linked when the line is saved.
      wireUploads(form, function () { return { lineNo: S.line && S.line.LineNo, lineKey: S.line && !S.line.LineNo ? S.line.lineKey : '' }; });

      form.querySelector('#cancel').addEventListener('click', function () { S.line = null; render(); });
      if (form.querySelector('#del')) form.querySelector('#del').addEventListener('click', function () {
        if (!confirm('Delete line ' + lineNo + '?')) return;
        busy(true);
        call('deleteLine', S.id, lineNo).then(function (b) { apply(b); busy(false); S.line = null; render(); }).catch(fail);
      });
      if (form.querySelector('#dup')) form.querySelector('#dup').addEventListener('click', function () {
        S.line = duplicateOf(Object.assign({}, S.line, readFields(form, fields)));
        render();
        scrollToForm();
        toast('Copy of this line: change what differs, then save.');
      });
      var saveOnly = function () {
        saveLineForm(form, fields, false).then(function (n) { if (n) { S.line = null; render(); if (!lineWarnings(n)) toast('Line ' + n + ' saved'); } }).catch(function () {});
      };
      S.save = editable() ? saveOnly : null;
      if (form.querySelector('#save')) form.querySelector('#save').addEventListener('click', saveOnly);
      if (form.querySelector('#saveadd')) form.querySelector('#saveadd').addEventListener('click', function () {
        saveLineForm(form, fields, false).then(function (n) {
          if (!n) return;
          var saved = S.lines.filter(function (l) { return Number(l.LineNo) === Number(n); })[0];
          S.line = canAddLine() ? newLine(saved) : null;
          render();
          scrollToForm();
          if (!lineWarnings(n)) toast('Line ' + n + ' saved');
        }).catch(function () {});
      });
    }

    // Initial payment is usually QPA minus cost sharing: it is suggested while the field is empty or still holds the suggestion.
    function wireAmounts(card) {
      var get = function (k) { return card.querySelector('.f[data-key="' + k + '"] input'); };
      var qpa = get('qpa'), cost = get('cost_sharing'), init = get('initial_payment');
      if (!qpa || !cost || !init) return;
      var isAmt = function (v) { return /^\d+(\.\d{1,2})?$/.test(String(v).trim()); };
      var cents = function (v) { return Math.round(Number(v) * 100); };
      var upd = function () {
        var q = qpa.value.trim(), c = cost.value.trim();
        if (isAmt(q) && isAmt(c) && cents(c) <= cents(q) && (init.value.trim() === '' || init.getAttribute('data-suggested') === init.value)) {
          init.value = ((cents(q) - cents(c)) / 100).toFixed(2);
          init.setAttribute('data-suggested', init.value);
          var lbl = init.parentNode.querySelector('label');
          if (lbl && !lbl.querySelector('[data-sugg]')) lbl.insertAdjacentHTML('beforeend', '<span class="chip" data-sugg title="QPA minus cost sharing">suggested</span>');
        }
        var i = init.value.trim(), msg = '';
        if (isAmt(q) && isAmt(c) && cents(c) > cents(q)) msg = 'Cost sharing is more than the QPA. Check both amounts.';
        else if (isAmt(q) && isAmt(c) && isAmt(i) && cents(c) + cents(i) !== cents(q)) msg = 'Cost sharing plus initial payment (' + moneyShown((cents(c) + cents(i)) / 100) + ') does not equal the QPA (' + moneyShown(q) + '). This does not block saving.';
        var w = card.querySelector('#amount-warn');
        w.textContent = msg;
        w.classList.toggle('hidden', !msg);
      };
      [qpa, cost].forEach(function (el) { el.addEventListener('input', upd); });
      init.addEventListener('input', function () {
        var s = init.parentNode.querySelector('[data-sugg]');
        if (s && init.value !== init.getAttribute('data-suggested')) s.parentNode.removeChild(s);
        upd();
      });
      upd();
    }

    // Shows the server's warnings about a saved line (claim elsewhere, amounts). Returns true when something was shown.
    function lineWarnings(n) {
      var line = S.lines.filter(function (l) { return Number(l.LineNo) === Number(n); })[0] || {};
      var claim = String(line.claim_number || '');
      var mine = S.warnings.filter(function (w) { return w.indexOf('Line ' + n + ':') === 0 || w.indexOf('Line ' + n + ' ') === 0 || (claim && w.indexOf('Claim ' + claim + ' ') === 0); });
      if (mine.length) toast('Line ' + n + ' saved. ' + mine.join(' '), 'warn');
      return mine.length > 0;
    }

    // Saves the open line form (its QPA documentation must be attached first, or come from another line of the claim).
    function saveLineForm(form, fields) {
      var values = readFields(form, fields);
      var rec = Object.assign({}, S.line, values);
      if (showErrors(form, fields, rec, ctxFor(S.d))) { toast('Fix the highlighted fields to save the line.', true); return Promise.reject(new Error('Fix the highlighted fields first.')); }
      if (pendingSuggestion(form)) return Promise.reject(new Error('Check the suggested spelling first.'));
      var hasDocs = filesFor('qpa', S.line.LineNo, S.line.lineKey).length || sameClaimDocs(values.claim_number, S.line.LineNo).length;
      if (!hasDocs) {
        toast('Upload the claim and QPA documentation for this line.', true);
        return Promise.resolve(null);
      }
      busy(true);
      return call('saveLine', S.id, S.line.LineNo || null, values, S.line.LineNo ? '' : S.line.lineKey || '').then(function (r) {
        S.line = Object.assign({}, rec, { LineNo: r.lineNo, lineKey: '' });
        learnLocal(fields, values);
        apply(r.bundle);
        busy(false);
        return r.lineNo;
      }).catch(function (e) { fail(e); throw e; });
    }

    // ---------------------------------------------------------------- bulk paste (tab-separated, from a spreadsheet)

    var PASTE_COLS = ['description', 'claim_number', 'service_date', 'qpa', 'cost_sharing', 'initial_payment', 'service_code', 'modifiers', 'pos_code'];

    function pasteDate(v) {
      v = String(v || '').trim();
      var m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      return m ? m[3] + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2) : v;
    }

    // Rows of description, claim, date, QPA, cost sharing, initial payment, code, modifiers, POS. A header row is skipped.
    function parsePaste(text) {
      var fields = lineSchemaFields();
      var ctx = ctxFor(S.d);
      var itemDefault = (defaultFor('item_types') || {}).value || optValue('ItemType', 'emergency');
      var posDefault = (defaultFor('pos_code') || {}).value || '23';
      return String(text || '').split(/\r?\n/).filter(function (l) { return l.trim(); }).filter(function (l, i) {
        return !(i === 0 && /claim/i.test(l) && /desc/i.test(l));
      }).map(function (line) {
        var cells = line.split('\t');
        var v = {};
        PASTE_COLS.forEach(function (k, i) { v[k] = String(cells[i] == null ? '' : cells[i]).trim(); });
        v.service_date = pasteDate(v.service_date);
        ['qpa', 'cost_sharing', 'initial_payment'].forEach(function (k) { v[k] = v[k].replace(/[$,\s]/g, ''); });
        v.service_code = v.service_code.toUpperCase();
        v.modifiers = normModifiers(v.modifiers);
        if (!v.pos_code) v.pos_code = posDefault;
        if (!v.description) { var e = entryFor('ServiceCode', v.service_code); if (e) v.description = (e.d && e.d.description) || e.l || ''; }
        v.item_types = itemDefault;
        v.location = 'TX';
        var errors = [];
        fields.forEach(function (f) {
          if (f.type === 'file') return;
          var m = check(f, v[f.key], v, ctx);
          if (m) errors.push(f.label.replace(/:$/, '') + ': ' + m);
        });
        return { values: v, errors: errors };
      });
    }

    function pastePanel() {
      var p = S.paste, rows = p.rows;
      var h = '<div class="line-form paste"><h3>Paste lines from a spreadsheet</h3><p class="note">Copy the rows in this column order (tab-separated, as Excel or Sheets copy them): ' +
        'description, claim number, date of service, QPA, cost sharing, initial payment, service code, modifiers, POS. Item type is set to the default and location to TX. ' +
        'QPA documents are linked from other lines with the same claim number; upload the others on each line.</p>' +
        '<textarea id="paste-text" placeholder="Paste here">' + esc(p.text) + '</textarea>' +
        '<div class="row-actions" style="margin-top:8px"><button class="secondary" id="paste-check">Check rows</button><button class="ghost" id="paste-cancel">Cancel</button></div>';
      if (rows) {
        var good = rows.filter(function (r) { return !r.errors.length; }).length;
        h += '<div style="overflow-x:auto;margin-top:10px"><table class="grid"><tr><th>Row</th>' + PASTE_COLS.map(function (k) { return '<th>' + esc(k.replace(/_/g, ' ')) + '</th>'; }).join('') + '<th>Check</th></tr>' +
          rows.map(function (r, i) {
            return '<tr><td>' + (i + 1) + '</td>' + PASTE_COLS.map(function (k) { return '<td>' + esc(r.values[k]) + '</td>'; }).join('') +
              '<td>' + (r.errors.length ? '<span class="bad-count">' + esc(r.errors.join('; ')) + '</span>' : '<span class="ok-tick">✓</span>') + '</td></tr>';
          }).join('') + '</table></div>' +
          (good === rows.length && rows.length ? '<p><button class="primary" id="paste-add">Add ' + rows.length + ' line item(s)</button></p>'
            : '<p class="muted">' + good + ' of ' + rows.length + ' row(s) are ready. Fix the others in the spreadsheet and paste again.</p>');
      }
      return h + '</div>';
    }

    function wirePaste(card) {
      var ta = card.querySelector('#paste-text');
      card.querySelector('#paste-cancel').addEventListener('click', function () { S.paste = null; render(); });
      card.querySelector('#paste-check').addEventListener('click', function () {
        S.paste = { text: ta.value, rows: parsePaste(ta.value) };
        var room = rules().maxLines - S.lines.length;
        if (S.paste.rows.length > room) toast('Only ' + room + ' more line item(s) fit in this dispute.', true);
        render();
        scrollToForm();
      });
      var add = card.querySelector('#paste-add');
      if (add) add.addEventListener('click', function () {
        var rows = S.paste.rows.map(function (r) { return r.values; });
        busy(true);
        call('saveLines', S.id, rows).then(function (r) {
          learnLocal(lineSchemaFields(), {});
          rows.forEach(function (v) { learnLocal(lineSchemaFields(), v); });
          apply(r.bundle);
          busy(false);
          S.paste = null;
          render();
          toast(r.lineNos.length + ' line item(s) added. Upload the QPA documents where a line shows "to fix".');
        }).catch(fail);
      });
    }

    // ---------------------------------------------------------------- page 7: Review & Submit

    function shownValue(f, rec, lineNo) {
      if (f.type === 'file') return filesFor(f.category, lineNo).map(function (x) { return x.Name; }).join(', ') || '(no file)';
      if (isFixed(f)) return String(f.default);
      var v = rec[f.key];
      if (isEmpty(v)) return '';
      if (f.type === 'date') return usDate(v);
      if (f.type === 'money') return moneyShown(v);
      if (f.type === 'check') return v === 'Yes' ? 'Ticked' : '';
      return String(v);
    }

    function renderReview() {
      var sc = S.boot.schema;
      var ctx = ctxFor(S.d);
      var inner = '<p class="sub">Check each page. Edit opens the page. The US desk enters the same values in the portal and selects Submit there.</p>';
      [0, 1, 2, 3, 4, 5].forEach(function (i) {
        var page = pageAt(i), issues = pageIssues(i);
        inner += '<div class="review-sec"><div class="head"><b>' + (i + 1) + ' · ' + esc(page.title) + '</b><span class="row-actions">' +
          (issues.length ? '<span class="bad-count">' + issues.length + ' to fix</span>' : '<span class="ok-tick">✓</span>') +
          '<button class="link" data-goto="' + i + '">' + (editable() ? 'Edit' : 'View') + '</button></span></div>';
        if (i === 4) {
          inner += linesGrid();
        } else {
          inner += '<div class="kv">' + pageFields(page).filter(function (f) {
            return fieldShown(f, S.d, ctx) && (f.type === 'file' ? fieldRequired(f, S.d, ctx) || filesFor(f.category).length : !isEmpty(S.d[f.key]));
          }).map(function (f) { return '<div class="k">' + esc(f.label.replace(/:$/, '')) + '</div><div>' + esc(shownValue(f, S.d)) + '</div>'; }).join('') + '</div>';
        }
        if (issues.length) inner += '<ul class="muted" style="margin:6px 0 0">' + issues.slice(0, 8).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
        inner += '</div>';
      });
      inner += '<div class="sig"><b>Initiating party (signature):</b> ' + (S.d.prov_name ? esc(S.d.prov_name) : '<span class="muted">the provider name (page 3)</span>') +
        ' <span class="muted">· Date: filled by the portal when the US desk submits</span></div>' +
        (S.d.on_start_date ? deadlineText(S.d.on_start_date, S.d) : '') + warnBox(S.warnings) + '<div id="result"></div>';
      inner += footer({ back: true, next: editable() ? 'Save & create confirmation PDF' : '' });
      app.innerHTML = editorShell(inner, sc.review.step, sc.review.title);
      wireShell();
      app.querySelectorAll('[data-goto]').forEach(function (b) {
        b.addEventListener('click', function () { S.page = Number(b.getAttribute('data-goto')); render(); });
      });
      var fin = app.querySelector('#cont');
      if (fin) fin.addEventListener('click', function () {
        busy(true);
        call('finalizeDispute', S.id).then(function (r) {
          busy(false);
          var box = app.querySelector('#result');
          if (!r.ok) {
            box.innerHTML = problemBox(r.problems, 'Fix these before it can go to the US desk:');
            box.scrollIntoView({ behavior: 'smooth' });
            return;
          }
          apply(r.bundle);
          render();
          app.querySelector('#result').innerHTML = '<div class="okbox"><b>Saved and sent to the US desk.</b> The confirmation PDF is in the dispute folder: ' +
            '<a target="_blank" rel="noopener" href="' + esc(r.pdfUrl) + '">open the PDF</a>.</div>';
        }).catch(fail);
      });
    }

    // ---------------------------------------------------------------- US copy desk

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
      }
      return legacyCopy(text);
    }
    function legacyCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject(new Error('Copy blocked by the browser. Select the value and press Ctrl+C.'));
    }

    function copyRow(key, label, value, kind) {
      var empty = value === '' || value == null;
      var done = S.copied[key];
      var shown = empty ? '<span class="muted">(blank: leave empty)</span>' : esc(value);
      var btn = kind === 'tick' || kind === 'file' ? '' :
        '<button class="copy" data-copy="' + esc(key) + '" data-value="' + esc(value) + '"' + (empty ? ' disabled' : '') + '>' + (done ? 'Copied ✓' : 'Copy') + '</button>';
      return '<div class="crow' + (done ? ' copied' : '') + '" data-row="' + esc(key) + '"><div class="l">' + esc(label) + '</div><div class="v">' + shown + '</div>' + btn + '</div>';
    }

    function deskField(f, rec, prefix, lineNo, ctx) {
      var key = prefix + f.key;
      if (!fieldShown(f, rec, ctx)) return '';
      if (f.type === 'file') {
        var list = filesFor(f.category, lineNo);
        if (!list.length && !fieldRequired(f, rec, ctx)) return '';
        return '<div class="crow"><div class="l">' + esc(f.label) + '</div><div class="v">' +
          (list.length ? list.map(function (x) { return '<a href="' + esc(x.Url) + '" target="_blank" rel="noopener">' + esc(x.Name) + '</a>'; }).join('<br>') : '<span class="muted">No file</span>') +
          '</div><span class="muted" style="font-size:12px">Upload in portal</span></div>';
      }
      var v = rec[f.key];
      if (f.type === 'checkboxes') {
        var items = String(v || '').split(/;\s*/).filter(String);
        return '<div class="crow"><div class="l">' + esc(f.label) + '</div><div class="v"><ul class="tick-list">' +
          items.map(function (i) { return '<li>Tick: ' + esc(i) + '</li>'; }).join('') + '</ul></div><span></span></div>';
      }
      if (f.type === 'check') return '<div class="crow"><div class="l">' + esc(f.label) + '</div><div class="v">' + (v === 'Yes' ? 'Tick the box' : '<span class="muted">Not ticked</span>') + '</div><span></span></div>';
      if (f.type === 'radio') return '<div class="crow"><div class="l">' + esc(f.label) + '</div><div class="v">Select: ' + esc(v) + '</div><span></span></div>';
      return copyRow(key, f.label + (f.type === 'select' ? ' (choose)' : ''), copyValue(f, v), 'copy');
    }

    function deskFields(rec, fields, prefix, lineNo, ctx) {
      return fields.map(function (f) { return deskField(f, rec, prefix, lineNo, ctx); }).join('');
    }

    function deskCounts() {
      var all = app.querySelectorAll('.copy:not([disabled])').length;
      var done = app.querySelectorAll('.crow.copied').length;
      return { all: all, done: done };
    }

    // The portal session times out after 60 minutes of inactivity and saves nothing: a reminder timer.
    function stopTimer() { if (S.timer) { clearInterval(S.timer.h); S.timer = null; } }
    function tickTimer() {
      var el = document.getElementById('timer');
      if (!el || !S.timer) return;
      var total = rules().sessionMinutes, warnAt = rules().warnMinutes;
      var mins = (Date.now() - S.timer.start) / 60000, left = Math.max(0, total - mins);
      var m = Math.floor(left), s = Math.floor((left - m) * 60);
      el.textContent = (left > 0 ? m + ':' + ('0' + s).slice(-2) + ' left' : 'Time is up');
      el.className = 'timer' + (mins >= total ? ' over' : mins >= warnAt ? ' warn' : '');
      if (mins >= warnAt && !S.timer.warned) { S.timer.warned = true; toast(warnAt + ' minutes in the portal: finish and submit, or the session times out at ' + total + ' minutes and nothing is saved.', 'warn'); }
    }

    function renderDesk() {
      var sc = S.boot.schema;
      var dl = S.deadline;
      var ctx = ctxFor(S.d);
      var gw = S.boot.gateway;
      // Before business day 31 the portal refuses the dispute: the US desk waits for the window.
      var notOpen = !!(dl && dl.band === 'early' && S.d.Status !== 'Filed');
      var lockAttr = notOpen ? ' disabled data-locked title="Filing window opens ' + esc(portalDate(dl.opens)) + '"' : '';

        '<p class="sub">Copy each value into the portal from top to bottom. The sections follow the portal\'s pages.</p>' +
        (dl && S.d.Status !== 'Filed' ? '<div>' + deadlineText(S.d.on_start_date, S.d) + '</div>' : '') + '</div>' +
        '<div class="progress"><b id="prog-text"></b><div class="bar"><i id="prog-bar"></i></div>' +
        '<p style="margin:8px 0 0"><a target="_blank" rel="noopener" href="' + esc(S.d.FolderUrl) + '">Open dispute folder</a>' +
        (S.d.ConfirmationPdfUrl ? ' · <a target="_blank" rel="noopener" href="' + esc(S.d.ConfirmationPdfUrl) + '">Prepared summary PDF</a>' : '') +

      }
      if (S.d.Status !== 'Filed') {
        h += '<div class="card page-card"><div class="session"><div><b>Start only when you can finish this dispute in one sitting.</b>' +
          '<div class="muted">The portal times out after ' + rules().sessionMinutes + ' minutes of inactivity and saves nothing when you leave it.</div></div>' +
          '<div style="display:flex;gap:10px;align-items:center"><span id="timer" class="timer">' + (S.timer ? '' : rules().sessionMinutes + ':00') + '</span>' +

      sc.pages.forEach(function (p) {

          if (sec.collapsible && !sec.fields.some(function (f) { return !isEmpty(S.d[f.key]); })) return;
          if (sec.title) h += '<div class="sec-title">' + esc(sec.title) + '</div>';
          h += body;
        });
        h += '</div>';
      });

      var lineByKey = {};
      sc.line.sections.forEach(function (sec) { sec.fields.forEach(function (f) { lineByKey[f.key] = f; }); });

          return '<button data-line-tab="' + i + '" class="' + (i === S.deskLine ? 'on' : '') + '">Line ' + esc(l.LineNo) + '</button>';
        }).join('') + '</div>';
      var line = S.lines[S.deskLine];

            if (line.line_type) h += '<div class="crow"><div class="l">Item or Service Type (set by the portal)</div><div class="v">' + esc(line.line_type) + '</div><span></span></div>';
            return;

        h += '<p class="muted" style="margin-top:10px">' + (S.deskLine < S.lines.length - 1 ? 'In the portal: Save & Add Another, then line ' + esc(S.lines[S.deskLine + 1].LineNo) + '.' : 'Last line: Save Item & Continue, then check the summary table against ' + S.lines.length + ' line item(s).') + '</p>';
